<div class="relation-modal-overlay" *ngIf="visible">
    <div class="relation-modal">
        <div class="modal-header">
            <h3>{{ title }}</h3>
            <button class="btn-close" (click)="close()">×</button>
        </div>

        <div class="modal-body">
            <div class="search-section" *ngIf="showSearch">
                <label>Existierende Person suchen</label>
                <div class="search-input-wrapper">
                    <input type="text" #relSearch (input)="search(relSearch.value)" placeholder="Name eingeben..."
                        class="form-control">
                    <div class="search-results" *ngIf="showResults()">
                        <div *ngFor="let res of searchResults()" class="result-item" (click)="selectExisting(res)">
                            {{ res.firstName }} {{ res.lastName }} ({{ res.id }})
                        </div>
                        <div *ngIf="searchResults().length === 0" class="no-results-item">Keine Ergebnisse</div>
                    </div>
                </div>
            </div>

            <div class="divider-text" *ngIf="showSearch"><span>ODER NEU ANLEGEN</span></div>

            <div class="creation-section">
                <div class="form-row">
                    <div class="form-group">
                        <label>Vorname</label>
                        <input type="text" [ngModel]="newPersonData().firstName"
                            (ngModelChange)="updateField('firstName', $event)" class="form-control"
                            placeholder="Vorname">
                    </div>
                    <div class="form-group">
                        <label>Nachname</label>
                        <input type="text" [ngModel]="newPersonData().lastName"
                            (ngModelChange)="updateField('lastName', $event)" class="form-control"
                            placeholder="Nachname">
                    </div>
                </div>
                <div class="form-group">
                    <label>Geschlecht</label>
                    <div class="gender-toggle-small">
                        <button type="button" class="btn-gender" [class.active]="newPersonData().gender === 'M'"
                            (click)="updateField('gender', 'M')">M</button>
                        <button type="button" class="btn-gender" [class.active]="newPersonData().gender === 'F'"
                            (click)="updateField('gender', 'F')">F</button>
                        <button type="button" class="btn-gender" [class.active]="newPersonData().gender === 'U'"
                            (click)="updateField('gender', 'U')">?</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" (click)="close()">Abbrechen</button>
            <button class="btn btn-primary" [disabled]="!newPersonData().firstName || isSaving()" (click)="save()">
                {{ isSaving() ? 'Wird angelegt...' : 'Anlegen & Verknüpfen' }}
            </button>
        </div>
    </div>
</div>
