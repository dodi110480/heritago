<app-modal-shell [visible]="visible" [title]="title" size="sm" [showFooter]="false" [showSave]="false"
    (close)="close()">
    <div class="relative z-10 flex flex-col gap-6">
        <!-- Modal Body -->
        <div class="flex flex-col gap-6 max-h-[70vh] overflow-y-auto px-1 custom-scrollbar">
            <!-- Search Section -->
            <div class="flex flex-col gap-3" *ngIf="showSearch">
                <label class="form-label">Existierende Person suchen</label>
                <div class="relative">
                    <div class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-800 dark:text-neutral-200">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </div>
                    <input type="text" #relSearch (input)="search(relSearch.value)" class="form-input pl-12"
                        placeholder="Name eingeben...">

                    <!-- Search Results Dropdown -->
                    <div *ngIf="showResults()"
                        class="absolute top-full left-0 right-0 mt-2 glass-card !rounded-2xl shadow-2xl z-50 overflow-hidden animate-in slide-in-from-top-2 duration-200">
                        <div *ngFor="let res of searchResults()" (click)="selectExisting(res)"
                            class="p-4 border-b border-canvas-white/5 last:border-0 hover:bg-brand-500/10 cursor-pointer transition-colors flex items-center justify-between group">
                            <div class="flex flex-col">
                                <span class="text-neutral-200 font-bold group-hover:text-brand-400">{{ res.firstName }}
                                    {{ res.lastName }}</span>
                                <span class="text-[10px] text-neutral-800 dark:text-neutral-200 font-mono">{{ res.id }}</span>
                            </div>
                            <svg class="w-4 h-4 text-neutral-600 group-hover:text-brand-400 group-hover:translate-x-1 transition-all"
                                xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </div>
                        <div *ngIf="searchResults().length === 0" class="p-6 text-center text-neutral-800 dark:text-neutral-200 text-sm italic">
                            Keine Ergebnisse gefunden
                        </div>
                    </div>
                </div>
            </div>

            <!-- Divider -->
            <div class="flex items-center gap-4 py-2" *ngIf="showSearch">
                <div class="h-px bg-canvas-white/5 flex-1"></div>
                <span class="text-[10px] font-black text-neutral-600 uppercase tracking-[0.4em]">Oder neu
                    anlegen</span>
                <div class="h-px bg-canvas-white/5 flex-1"></div>
            </div>

            <!-- Creation Form -->
            <div class="flex flex-col gap-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group mb-0">
                        <label class="form-label px-0">Vorname</label>
                        <input type="text" [ngModel]="newPersonData().firstName"
                            (ngModelChange)="updateField('firstName', $event)" class="form-input py-3"
                            placeholder="Vorname">
                    </div>
                    <div class="form-group mb-0">
                        <label class="form-label px-0">Nachname</label>
                        <input type="text" [ngModel]="newPersonData().lastName"
                            (ngModelChange)="updateField('lastName', $event)" class="form-input py-3"
                            placeholder="Nachname">
                    </div>
                </div>

                <div class="form-group mb-0">
                    <label class="form-label">Geschlecht</label>
                    <div class="grid grid-cols-3 gap-3 glass-card !p-1 !rounded-2xl">
                        <button type="button" (click)="updateField('gender', 'M')"
                            [class]="newPersonData().gender === 'M' ? 'bg-brand-600 text-canvas-white shadow-lg shadow-brand-sm' : 'text-neutral-800 dark:text-neutral-200 hover:text-neutral-300 hover:bg-canvas-white/5'"
                            class="py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all duration-300">
                            Männlich
                        </button>
                        <button type="button" (click)="updateField('gender', 'F')"
                            [class]="newPersonData().gender === 'F' ? 'bg-gender-female text-canvas-white shadow-lg shadow-gender-female/20' : 'text-neutral-800 dark:text-neutral-200 hover:text-neutral-300 hover:bg-canvas-white/5'"
                            class="py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all duration-300">
                            Weiblich
                        </button>
                        <button type="button" (click)="updateField('gender', 'U')"
                            [class]="newPersonData().gender === 'U' ? 'bg-brand-100 text-canvas-white' : 'text-neutral-800 dark:text-neutral-200 hover:text-neutral-300 hover:bg-canvas-white/5'"
                            class="py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all duration-300">
                            Unbekannt
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex gap-4 pt-4 px-1">
            <button (click)="close()"
                class="flex-1 py-4 bg-canvas-white/5 hover:bg-canvas-white/10 text-neutral-400 font-bold rounded-2xl border border-canvas-white/10 transition-colors">
                Abbrechen
            </button>
            <button (click)="save()" [disabled]="!newPersonData().firstName || isSaving()"
                class="flex-[2] btn-primary py-4 disabled:opacity-50 flex items-center justify-center gap-2">
                <span *ngIf="isSaving()"
                    class="w-5 h-5 border-2 border-canvas-white/20 border-l-white rounded-full animate-spin"></span>
                {{ isSaving() ? 'Wird angelegt...' : 'Anlegen & Verknüpfen' }}
            </button>
        </div>
    </div>
</app-modal-shell>
