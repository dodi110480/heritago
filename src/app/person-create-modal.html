<div class="modal-container" *ngIf="visible">
    <div class="modal-glass max-w-[500px]">
        <!-- Decorative Background Glow -->
        <div class="modal-glow-blue"></div>
        <div class="modal-glow-purple"></div>

        <div class="relative z-10 flex flex-col gap-6">
            <!-- Modal Header -->
            <div class="flex justify-between items-center px-1">
                <h3 class="text-xl font-bold text-white tracking-tight">{{ title }}</h3>
                <button (click)="close()"
                    class="p-2 rounded-full hover:bg-white/5 text-slate-400 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="flex flex-col gap-6 max-h-[70vh] overflow-y-auto px-1 custom-scrollbar">
                <!-- Search Section -->
                <div class="flex flex-col gap-3" *ngIf="showSearch">
                    <label class="form-label">Existierende Person suchen</label>
                    <div class="relative">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </div>
                        <input type="text" #relSearch (input)="search(relSearch.value)" class="form-input pl-12"
                            placeholder="Name eingeben...">

                        <!-- Search Results Dropdown -->
                        <div *ngIf="showResults()"
                            class="absolute top-full left-0 right-0 mt-2 glass-card !rounded-2xl shadow-2xl z-50 overflow-hidden animate-in slide-in-from-top-2 duration-200">
                            <div *ngFor="let res of searchResults()" (click)="selectExisting(res)"
                                class="p-4 border-b border-white/5 last:border-0 hover:bg-blue-500/10 cursor-pointer transition-colors flex items-center justify-between group">
                                <div class="flex flex-col">
                                    <span class="text-slate-200 font-bold group-hover:text-blue-400">{{ res.firstName }}
                                        {{ res.lastName }}</span>
                                    <span class="text-[10px] text-slate-500 font-mono">{{ res.id }}</span>
                                </div>
                                <svg class="w-4 h-4 text-slate-600 group-hover:text-blue-400 group-hover:translate-x-1 transition-all"
                                    xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <polyline points="9 18 15 12 9 6"></polyline>
                                </svg>
                            </div>
                            <div *ngIf="searchResults().length === 0"
                                class="p-6 text-center text-slate-500 text-sm italic">
                                Keine Ergebnisse gefunden
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Divider -->
                <div class="flex items-center gap-4 py-2" *ngIf="showSearch">
                    <div class="h-px bg-white/5 flex-1"></div>
                    <span class="text-[10px] font-black text-slate-600 uppercase tracking-[0.4em]">Oder neu
                        anlegen</span>
                    <div class="h-px bg-white/5 flex-1"></div>
                </div>

                <!-- Creation Form -->
                <div class="flex flex-col gap-5">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="form-group mb-0">
                            <label class="form-label px-0">Vorname</label>
                            <input type="text" [ngModel]="newPersonData().firstName"
                                (ngModelChange)="updateField('firstName', $event)" class="form-input py-3"
                                placeholder="Vorname">
                        </div>
                        <div class="form-group mb-0">
                            <label class="form-label px-0">Nachname</label>
                            <input type="text" [ngModel]="newPersonData().lastName"
                                (ngModelChange)="updateField('lastName', $event)" class="form-input py-3"
                                placeholder="Nachname">
                        </div>
                    </div>

                    <div class="form-group mb-0">
                        <label class="form-label">Geschlecht</label>
                        <div class="grid grid-cols-3 gap-3 glass-card !p-1 !rounded-2xl">
                            <button type="button" (click)="updateField('gender', 'M')"
                                [class]="newPersonData().gender === 'M' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'text-slate-500 hover:text-slate-300 hover:bg-white/5'"
                                class="py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all duration-300">
                                Männlich
                            </button>
                            <button type="button" (click)="updateField('gender', 'F')"
                                [class]="newPersonData().gender === 'F' ? 'bg-pink-600 text-white shadow-lg shadow-pink-600/20' : 'text-slate-500 hover:text-slate-300 hover:bg-white/5'"
                                class="py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all duration-300">
                                Weiblich
                            </button>
                            <button type="button" (click)="updateField('gender', 'U')"
                                [class]="newPersonData().gender === 'U' ? 'bg-slate-700 text-white' : 'text-slate-500 hover:text-slate-300 hover:bg-white/5'"
                                class="py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all duration-300">
                                Unbekannt
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="flex gap-4 pt-4 px-1">
                <button (click)="close()"
                    class="flex-1 py-4 bg-white/5 hover:bg-white/10 text-slate-400 font-bold rounded-2xl border border-white/10 transition-colors">
                    Abbrechen
                </button>
                <button (click)="save()" [disabled]="!newPersonData().firstName || isSaving()"
                    class="flex-[2] btn-primary py-4 disabled:opacity-50 flex items-center justify-center gap-2">
                    <span *ngIf="isSaving()"
                        class="w-5 h-5 border-2 border-white/20 border-l-white rounded-full animate-spin"></span>
                    {{ isSaving() ? 'Wird angelegt...' : 'Anlegen & Verknüpfen' }}
                </button>
            </div>
        </div>
    </div>
</div>
