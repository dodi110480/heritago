<app-page-container>
    <app-page-header title="Stammbaumverwaltung"
        description="Hier kannst du deine Stammbäume organisieren, bearbeiten oder löschen.">
        <button actions class="btn-primary !w-auto !py-2" (click)="openCreate()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Neuer Stammbaum</span>
        </button>
    </app-page-header>

    <div class="max-w-4xl mx-auto mt-12 pb-20">
        <div *ngIf="loading()" class="py-20 flex flex-col items-center gap-4 text-neutral-950">
            <div class="w-10 h-10 border-4 border-canvas-white/5 border-l-brand-500 rounded-full animate-spin"></div>
            <p class="font-bold uppercase tracking-widest text-xs">Lade Stammbäume...</p>
        </div>

        <div class="flex flex-col gap-4" *ngIf="!loading() && showForm() === 'none'">
            <div class="p-20 text-center glass-card !rounded-[40px]" *ngIf="availableTrees().length === 0">
                <p class="text-neutral-950 font-medium">Noch kein Stammbaum erstellt.</p>
            </div>

            <div *ngFor="let tree of availableTrees()"
                class="group flex items-center glass-card !rounded-3xl p-6 transition-all duration-300 hover:bg-surface/60 hover:border-brand-500/30 hover:-translate-y-1 shadow-lg"
                [class.ring-2]="tree.id === authService.currentTree()?.id"
                [class.ring-brand-500/50]="tree.id === authService.currentTree()?.id">

                <div class="flex-1 flex items-center gap-6 cursor-pointer" (click)="selectTree(tree)">
                    <div
                        class="w-16 h-16 bg-brand-500/10 text-brand-400 rounded-2xl border border-brand-500/20 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
                        🌳
                    </div>
                    <div class="flex flex-col gap-1">
                        <h3 class="text-xl font-bold text-canvas-white group-hover:text-brand-400 transition-colors">{{ tree.title }}</h3>
                        <span class="text-xs font-mono text-neutral-950 tracking-tighter">{{ tree.name }}</span>
                    </div>
                    <div class="ml-4 badge badge-primary" *ngIf="tree.id === authService.currentTree()?.id">Aktiv</div>
                </div>

                <div class="flex items-center gap-2 pl-6 border-l border-canvas-white/5">
                    <button (click)="openEdit(tree)"
                        class="p-3 rounded-xl hover:bg-canvas-white/5 text-neutral-400 hover:text-canvas-white transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                    </button>
                    <button (click)="deleteTree(tree)"
                        class="p-3 rounded-xl bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-canvas-white transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <line x1="10" y1="11" x2="10" y2="17"></line>
                            <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="glass-card !rounded-[40px] p-8 md:p-12 shadow-2xl relative overflow-hidden animate-in zoom-in-95 duration-300"
            *ngIf="showForm() !== 'none'">
            <div class="modal-glow-blue opacity-50"></div>

            <div class="relative z-10">
                <h2 class="text-3xl font-black text-canvas-white tracking-tighter mb-8">
                    {{ showForm() === 'create' ? 'Neuen Stammbaum erstellen' : 'Stammbaum bearbeiten' }}
                </h2>

                <div class="flex flex-col gap-6">
                    <div class="form-group">
                        <label class="form-label">Titel des Stammbaums *</label>
                        <input type="text" [(ngModel)]="title" placeholder="z. B. Familie Schmitt" class="form-input text-lg font-bold">
                    </div>

                    <ng-container *ngIf="showForm() === 'create'">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="form-group mb-0">
                                <label class="form-label">Vorname der Hauptperson *</label>
                                <input type="text" [(ngModel)]="firstName" placeholder="Vorname" class="form-input">
                            </div>
                            <div class="form-group mb-0">
                                <label class="form-label">Nachname der Hauptperson *</label>
                                <input type="text" [(ngModel)]="lastName" placeholder="Nachname" class="form-input">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="form-group mb-0">
                                <label class="form-label">Geschlecht</label>
                                <select [(ngModel)]="gender" class="form-input appearance-none bg-neutral-black/40">
                                    <option value="M">Männlich</option>
                                    <option value="F">Weiblich</option>
                                    <option value="X">Divers</option>
                                    <option value="U">Unbekannt</option>
                                </select>
                            </div>
                            <div class="form-group mb-0">
                                <label class="form-label">Geburtsdatum</label>
                                <input type="text" [(ngModel)]="birthDate" placeholder="TT.MM.JJJJ" class="form-input">
                            </div>
                        </div>
                    </ng-container>

                    <div class="form-group" *ngIf="showForm() === 'edit'">
                        <label class="form-label">Beschreibung (optional)</label>
                        <textarea [(ngModel)]="description" rows="3" class="form-input resize-none"
                            placeholder="Kurze Info zu diesem Baum..."></textarea>
                    </div>

                    <div class="form-error mt-2 mb-0" *ngIf="error()">{{ error() }}</div>

                    <div class="flex gap-4 mt-8">
                        <button class="flex-1 btn-secondary !py-4" (click)="cancelForm()">Abbrechen</button>
                        <button class="flex-[2] btn-primary !py-4 text-lg" (click)="saveTree()">
                            {{ showForm() === 'create' ? 'Erstellen' : 'Speichern' }}
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-12 text-center" *ngIf="showForm() === 'none'">
            <a routerLink="/settings"
                class="inline-flex items-center gap-3 text-neutral-950 hover:text-brand-400 font-bold uppercase tracking-widest text-xs transition-all hover:gap-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Zurück zu Einstellungen</span>
            </a>
        </div>
    </div>
</app-page-container>
