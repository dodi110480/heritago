<div class="group relative bg-brand-900/40 backdrop-blur-xl border border-canvas-white/10 rounded-[32px] p-6 transition-all duration-500 hover:bg-brand-200/60 hover:border-brand-500/30 shadow-2xl overflow-hidden"
    *ngIf="hasTree()">
    <!-- Decorative Glow -->
    <div class="modal-glow-brand opacity-20 group-hover:opacity-40 transition-opacity"></div>

    <div class="relative z-10">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-canvas-white/5">
            <h3 class="text-lg font-black text-canvas-white tracking-tight">An diesem Tag...</h3>
            <span class="badge badge-primary">
                {{ currentDate() }}
            </span>
        </div>

        <div *ngIf="loading()"
            class="py-8 flex justify-center text-neutral-800 dark:text-neutral-200 uppercase tracking-widest text-[10px] font-bold">
            <div class="w-4 h-4 border-2 border-canvas-white/10 border-l-brand-500 rounded-full animate-spin mr-2"></div>
            Laden...
        </div>

        <div *ngIf="!loading() && events().length === 0"
            class="py-8 text-center text-neutral-800 dark:text-neutral-200 text-sm font-medium italic">
            Keine Ereignisse heute.
        </div>

        <div class="flex flex-col gap-3" *ngIf="!loading() && events().length > 0">
            <div *ngFor="let event of events()"
                class="flex items-center gap-4 p-3 rounded-2xl bg-canvas-white/[0.03] border border-canvas-white/5 transition-all hover:bg-canvas-white/[0.08] hover:border-canvas-white/10 hover:translate-x-1 group/item">

                <div class="w-12 h-12 shrink-0 flex items-center justify-center text-xl rounded-xl border transition-all group-hover/item:scale-110"
                    [ngClass]="{
                        'bg-accent-danger-500/10 border-accent-danger-500/20 text-accent-danger-400': event.type === 'BIRT',
                        'bg-canvas-white/10 border-brand-50/20 text-neutral-400': event.type === 'DEAT',
                        'bg-accent-highlight-500/10 border-accent-highlight-500/20 text-accent-highlight-400': event.type === 'MARR'
                    }">
                    <span *ngIf="event.type === 'BIRT'">🎂</span>
                    <span *ngIf="event.type === 'DEAT'">⚰️</span>
                    <span *ngIf="event.type === 'MARR'">💍</span>
                </div>

                <div class="flex flex-col min-w-0">
                    <span class="text-neutral-200 font-bold truncate tracking-tight">{{ event.name }}</span>
                    <span class="text-[10px] font-bold text-neutral-800 dark:text-neutral-200 uppercase tracking-widest mt-0.5">
                        {{ event.years }} Jahre
                        <span class="text-brand-400/70" *ngIf="event.type === 'BIRT'">her</span>
                        <span class="text-accent-highlight-400/70" *ngIf="event.type === 'MARR'">verheiratet</span>
                        <span class="text-neutral-400/70" *ngIf="event.type === 'DEAT'">vergangen</span>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
