<div class="relative z-20 pb-20">
    <app-page-header [title]="'Willkommen zurück, ' + (authService.currentUser()?.username || '')"
        [description]="funStat()">
    </app-page-header>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-5 mb-10" *ngIf="!loading()">
        <app-stat-card [value]="stats()?.counts?.individuals || 0" label="Personen" icon="👥" accent="brand">
        </app-stat-card>
        <app-stat-card [value]="stats()?.counts?.families || 0" label="Familien" icon="👨‍👩‍👧‍👦"
            accent="highlight">
        </app-stat-card>
        <app-stat-card [value]="stats()?.counts?.media || 0" label="Medien" icon="🖼️" accent="highlight">
        </app-stat-card>
        <app-stat-card [value]="completeness() + '%'" label="Vollständigkeit" icon="✅" accent="success">
            <div class="w-full h-1 bg-canvas/5 rounded-full mt-3 overflow-hidden">
                <div class="h-full bg-gradient-to-r from-accent-success-500 to-accent-success-600 rounded-full shadow-sm transition-all duration-1000 ease-out"
                    [style.width.%]="completeness()"></div>
            </div>
        </app-stat-card>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-[1.5fr_1fr] gap-6 mb-16">
        <a routerLink="/tree"
            class="relative no-underline text-inherit flex items-center rounded-xl transition-all duration-[180ms] overflow-hidden bg-brand-500/10 border border-brand-500/20 p-10 gap-8 group hover:bg-brand-500/15 hover:border-brand-500/30 hover:-translate-y-1 hover:shadow-md">
            <div class="w-16 h-16 bg-white/10 rounded-xl flex items-center justify-center shrink-0 shadow-sm">
                <img src="/favicon.svg" alt="Tree" class="w-[60%] h-[60%] object-contain" />
            </div>
            <div>
                <h3 class="text-3xl font-bold mb-2 text-neutral-900">Stammbaum ansehen</h3>
                <p class="text-neutral-500 text-base leading-relaxed">Erforsche deine Ahnen in der interaktiven Ansicht</p>
            </div>
            <div
                class="text-3xl text-brand-500 ml-auto opacity-40 transition-all duration-[180ms] group-hover:translate-x-2 group-hover:opacity-100">
                →</div>
        </a>

        <div class="flex flex-col gap-5">
            <a (click)="toggleSwitcher()"
                class="flex flex-col sm:flex-row items-start sm:items-center glass-card gap-5 transition-all duration-[180ms] group cursor-pointer hover:scale-[1.02]">
                <div
                    class="text-brand-600 text-3xl font-extrabold w-14 h-14 bg-brand-500/10 rounded-xl flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform">
                    ＋</div>
                <div>
                    <h3 class="text-xl font-bold mb-1 text-neutral-900">Stammbaum wechseln</h3>
                    <p class="text-neutral-500 text-sm">Anderen Baum öffnen</p>
                </div>
            </a>
            <a (click)="discoverAncestor()"
                class="flex flex-col sm:flex-row items-start sm:items-center glass-card !bg-accent-highlight-500/5 border border-accent-highlight-200/50 p-6 gap-5 rounded-xl transition-all duration-[180ms] group cursor-pointer hover:scale-[1.02]">
                <div
                    class="text-accent-highlight-600 text-2xl w-14 h-14 bg-accent-highlight-500/10 rounded-xl flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform">
                    ✨</div>
                <div>
                    <h3 class="text-xl font-bold mb-1 text-neutral-900">Entdecken</h3>
                    <p class="text-neutral-500 text-sm">Zufälligen Vorfahren finden</p>
                </div>
            </a>
        </div>
    </div>

    <div
        class="flex flex-wrap justify-center gap-2 glass-card !p-2 !rounded-xl mb-16 max-w-fit mx-auto">
        <a routerLink="/map" title="Karte"
            class="flex items-center gap-2 px-4 py-2 rounded-lg text-neutral-500 hover:text-brand-600 hover:bg-brand-500/5 transition-all duration-[180ms]">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5">
                <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
            </svg>
            <span class="text-xs font-bold uppercase tracking-wider">Karte</span>
        </a>
        <a routerLink="/media" title="Galerie"
            class="flex items-center gap-2 px-4 py-2 rounded-lg text-neutral-500 hover:text-brand-600 hover:bg-brand-500/5 transition-all duration-[180ms]">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span class="text-xs font-bold uppercase tracking-wider">Galerie</span>
        </a>
        <a routerLink="/statistics" title="Statistik"
            class="flex items-center gap-2 px-4 py-2 rounded-lg text-neutral-500 hover:text-brand-600 hover:bg-brand-500/5 transition-all duration-[180ms]">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            <span class="text-xs font-bold uppercase tracking-wider">Statistik</span>
        </a>
        <a routerLink="/activity" title="Aktivität"
            class="flex items-center gap-2 px-4 py-2 rounded-lg text-neutral-500 hover:text-brand-600 hover:bg-brand-500/5 transition-all duration-[180ms]">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
            <span class="text-xs font-bold uppercase tracking-wider">Aktivität</span>
        </a>
        <a routerLink="/diagnostics" title="Fehlersuche"
            class="flex items-center gap-2 px-4 py-2 rounded-lg text-neutral-500 hover:text-brand-600 hover:bg-brand-500/5 transition-all duration-[180ms]">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span class="text-xs font-bold uppercase tracking-wider">Prüfung</span>
        </a>
    </div>

    <div>
        <app-calendar-widget></app-calendar-widget>
    </div>
</div>

<div class="fixed inset-0 bg-ui-bg/90 backdrop-blur-md flex justify-center items-center z-modal"
    *ngIf="showTreeSwitcher()" (click)="$event.stopPropagation(); toggleSwitcher()">
    <div class="glass-card !rounded-2xl border border-neutral-200 shadow-xl max-w-lg w-full mx-4"
        (click)="$event.stopPropagation()">
        <h2 class="text-2xl font-bold text-neutral-900 mb-6">Stammbaum wählen</h2>
        <div class="flex flex-col gap-3 max-h-[400px] overflow-y-auto pr-2">
            <div *ngFor="let tree of availableTrees()"
                class="glass-card !p-4 !rounded-xl flex items-center gap-4 cursor-pointer transition-all hover:bg-brand-500/10"
                [ngClass]="{'border-brand-500 bg-brand-500/10': tree.name === treeName()}" draggable="true"
                (dragstart)="onDragStart($event, tree)" (dragend)="onDragEnd()" (click)="selectTree(tree)">
                <div
                    class="w-10 h-10 shrink-0 bg-neutral-100 rounded-xl flex items-center justify-center border border-neutral-200">
                    <img src="/favicon.svg" alt="Tree" class="w-6 h-6" />
                </div>
                <div class="flex flex-col">
                    <span class="block font-bold text-neutral-900">{{ tree.title }}</span>
                    <span class="text-[10px] uppercase font-bold tracking-widest text-neutral-400">{{ tree.name }}</span>
                </div>
            </div>
        </div>
    </div>
</div>
