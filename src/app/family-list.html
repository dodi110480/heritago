<app-page-container [wide]="true">
    <app-page-header title="Familien-Übersicht" [description]="treeName() ? 'Stammbaum: ' + treeName() : ''">

        <div actions class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
            <!-- Suche -->
            <div class="search-wrapper">
                <div class="search-icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <input type="text" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)"
                    placeholder="Nach Namen suchen..." class="search-input">
            </div>

            <!-- Sortierung -->
            <select [ngModel]="sortMode()" (ngModelChange)="sortMode.set($event)"
                class="glass-card !px-3 !py-2.5 !rounded-xl text-neutral-900 min-w-[200px] w-full md:w-auto outline-none focus:ring-2 focus:ring-brand-500/30">
                <option value="date_desc" class="bg-neutral-100 text-neutral-900">Neueste Hochzeiten</option>
                <option value="children_desc" class="bg-neutral-100 text-neutral-900">Meiste Kinder</option>
                <option value="names_asc" class="bg-neutral-100 text-neutral-900">Name Partner (A-Z)</option>
            </select>
        </div>
    </app-page-header>

    <!-- CONTENT -->
    <!-- CONTENT -->
    <app-list-view
        [isLoading]="loading()"
        [isEmpty]="filteredFamilies().length === 0"
        loadingText="Lade Familien-Archiv..."
        emptyIcon="👨‍👩‍👧‍👦"
        emptyTitle="Keine Familien gefunden"
        emptySubtitle="Probiere es mit einem anderen Suchbegriff.">

        <app-entity-card *ngFor="let fam of filteredFamilies()"
            [title]="getPersonName(fam.husband) + ' & ' + getPersonName(fam.wife)"
            [subtitle]="getFamilyStatusIcon(fam) + ' ' + (getMarriageInfo(fam) || 'Keine Daten')"
            [meta]="getMarriageSubtypeLabels(fam).join(', ')" [avatarUrl]="getFamilyImage(fam)"
            badgeText="Familie" badgeColor="highlight" [routerLink]="['/family', fam.id]">

            <div actions *ngIf="fam.children?.length"
                class="text-xs px-2.5 py-1 rounded bg-brand-100/50 text-brand-400 font-bold border border-brand-500/10 whitespace-nowrap"
                [title]="getChildrenTooltip(fam)">
                {{ fam.children.length }} Kinder
            </div>
        </app-entity-card>

    </app-list-view>
</app-page-container>
