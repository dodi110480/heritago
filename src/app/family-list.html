<app-page-container [wide]="true">
    <app-page-header title="Familien-Übersicht" [description]="treeName() ? 'Stammbaum: ' + treeName() : ''">

        <div actions class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
            <!-- Suche -->
            <div class="search-wrapper">
                <div class="search-icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <input type="text" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)"
                    placeholder="Nach Namen suchen..." class="search-input">
            </div>

            <!-- Sortierung -->
            <select [ngModel]="sortMode()" (ngModelChange)="sortMode.set($event)"
                class="glass-card !px-3 !py-2.5 !rounded-xl text-neutral-100 min-w-[200px] w-full md:w-auto outline-none focus:ring-2 focus:ring-brand-500/30">
                <option value="date_desc" class="bg-surface-dark text-neutral-200">Neueste Hochzeiten</option>
                <option value="children_desc" class="bg-surface-dark text-neutral-200">Meiste Kinder</option>
                <option value="names_asc" class="bg-surface-dark text-neutral-200">Name Partner (A-Z)</option>
            </select>
        </div>
    </app-page-header>

    <!-- CONTENT -->
    <div class="relative w-full">
        <div *ngIf="loading()" class="py-20 flex flex-col items-center justify-center gap-4 text-brand-400">
            <div
                class="w-12 h-12 border-4 border-brand-500/20 border-t-brand-500 rounded-full animate-spin shadow-brand-glow">
            </div>
            <p class="font-bold tracking-widest uppercase text-xs animate-pulse">Lade Familien-Archiv...</p>
        </div>

        <div *ngIf="!loading() && filteredFamilies().length === 0"
            class="py-32 flex flex-col items-center justify-center text-neutral-500 glass-card">
            <div class="w-20 h-20 bg-canvas-white/5 rounded-full flex items-center justify-center mb-6 text-4xl opacity-20">
                👨‍👩‍👧‍👦
            </div>
            <h3 class="text-xl font-bold text-canvas-white mb-2">Keine Familien gefunden</h3>
            <p class="text-neutral-400">Probiere es mit einem anderen Suchbegriff.</p>
        </div>

        <div *ngIf="!loading()"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 animate-in fade-in slide-in-from-bottom-4 duration-700">
            <ng-container *ngFor="let fam of filteredFamilies()">
                <app-entity-card [title]="getPersonName(fam.husband) + ' & ' + getPersonName(fam.wife)"
                    [subtitle]="getFamilyStatusIcon(fam) + ' ' + (getMarriageInfo(fam) || 'Keine Daten')"
                    [meta]="getMarriageSubtypeLabels(fam).join(', ')" [avatarUrl]="getFamilyImage(fam)"
                    badgeText="Familie" badgeColor="highlight" [routerLink]="['/family', fam.id]">

                    <div actions *ngIf="fam.children?.length"
                        class="text-xs px-2.5 py-1 rounded bg-surface-darkest/50 text-brand-400 font-bold border border-brand-500/10 whitespace-nowrap"
                        [title]="getChildrenTooltip(fam)">
                        {{ fam.children.length }} Kinder
                    </div>
                </app-entity-card>
            </ng-container>
        </div>
    </div>
</app-page-container>
