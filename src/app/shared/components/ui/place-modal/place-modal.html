<app-modal-shell [visible]="visible" [title]="mode === 'add' ? 'Neuen Ort anlegen' : 'Ort bearbeiten'" icon="📍"
  size="lg" [loading]="isSaving()"
  [disabledSave]="!modalData.description?.trim() || !modalData.latitude || !modalData.longitude" (close)="closeModal()"
  (save)="save()">

  <div class="flex flex-col h-[600px] max-h-[80vh]">
    <!-- Fehleranzeige -->
    <div
      class="bg-accent-danger-500/10 border border-accent-danger-500/20 text-accent-danger-500 p-3 rounded-xl text-sm mb-5 shrink-0"
      *ngIf="errorMessage()">
      {{ errorMessage() }}
    </div>

    <!-- Modal Tabs -->
    <div class="flex border-b border-canvas/10 dark:border-white/10 mb-6 shrink-0">
      <button (click)="setTab('basics')"
        [class]="activeTab() === 'basics' ? 'border-b-2 border-brand-500 text-brand-500' : 'text-neutral-500 hover:text-neutral-700 dark:hover:text-neutral-300'"
        class="px-4 py-3 text-sm font-bold uppercase tracking-wider transition-all">Basis</button>
      <button (click)="setTab('languages')"
        [class]="activeTab() === 'languages' ? 'border-b-2 border-brand-500 text-brand-500' : 'text-neutral-500 hover:text-neutral-700 dark:hover:text-neutral-300'"
        class="px-4 py-3 text-sm font-bold uppercase tracking-wider transition-all">
        Sprachen <span
          class="ml-1 px-1.5 py-0.5 bg-neutral-100 dark:bg-neutral-800 rounded-full text-[10px]">{{modalData.translations?.length
          || 0}}</span>
      </button>
      <button (click)="setTab('location')"
        [class]="activeTab() === 'location' ? 'border-b-2 border-brand-500 text-brand-500' : 'text-neutral-500 hover:text-neutral-700 dark:hover:text-neutral-300'"
        class="px-4 py-3 text-sm font-bold uppercase tracking-wider transition-all">Position</button>
      <button (click)="setTab('notes')"
        [class]="activeTab() === 'notes' ? 'border-b-2 border-brand-500 text-brand-500' : 'text-neutral-500 hover:text-neutral-700 dark:hover:text-neutral-300'"
        class="px-4 py-3 text-sm font-bold uppercase tracking-wider transition-all">
        Notizen <span
          class="ml-1 px-1.5 py-0.5 bg-neutral-100 dark:bg-neutral-800 rounded-full text-[10px]">{{notes().length}}</span>
      </button>
      <button *ngIf="mode === 'edit'" (click)="setTab('links')"
        [class]="activeTab() === 'links' ? 'border-b-2 border-brand-500 text-brand-500' : 'text-neutral-500 hover:text-neutral-700 dark:hover:text-neutral-300'"
        class="px-4 py-3 text-sm font-bold uppercase tracking-wider transition-all">
        Links <span
          class="ml-1 px-1.5 py-0.5 bg-neutral-100 dark:bg-neutral-800 rounded-full text-[10px]">{{usages().length}}</span>
      </button>
    </div>

    <!-- Tab Content -->
    <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar space-y-6">

      <!-- Tab: Basis -->
      <div *ngIf="activeTab() === 'basics'" class="space-y-6 animate-in fade-in slide-in-from-top-2 duration-300">
        <div class="space-y-1.5">
          <label class="form-label">Beschreibung / Lokalität *</label>
          <input type="text" [(ngModel)]="modalData.description" class="form-input"
            placeholder="z.B. Rathaus Hirschberg, Ev. Kirche Lubenz, Friedhof">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div class="space-y-1.5">
            <label class="form-label">Sprachcode (ISO)</label>
            <input type="text" [(ngModel)]="modalData.lang" class="form-input" placeholder="z.B. de, en, pl, cs">
          </div>
          <div class="space-y-1.5">
            <label class="form-label">Hierarchie-Level</label>
            <select [(ngModel)]="modalData.level" class="form-input">
              <option *ngFor="let lvl of placeLevels" [value]="lvl.value">{{ lvl.label }}</option>
            </select>
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="form-label">Historische Namen</label>
          <input type="text" [(ngModel)]="modalData.historicNames" class="form-input"
            placeholder="Kommagetrennt, z.B. Hirschberg, Jelenia Góra, Grünberg">
        </div>

        <div class="space-y-3">
          <div class="flex justify-between items-center">
            <label class="form-label">Externe Identifikatoren</label>
            <button (click)="addIdentifier()" class="text-brand-600 hover:text-brand-700 text-sm font-bold">
              + ID Hinzufügen
            </button>
          </div>
          <div *ngFor="let id of modalData.identifiers; let i = index"
            class="flex gap-3 items-center p-3 bg-canvas/5 dark:bg-white/5 rounded-xl border border-canvas/10 dark:border-white/10">
            <input type="text" [(ngModel)]="id.type" placeholder="Typ (wikidata...)"
              class="form-input !text-xs !py-1.5 flex-1">
            <input type="text" [(ngModel)]="id.value" placeholder="ID-Wert" class="form-input !text-xs !py-1.5 flex-1">
            <button (click)="removeIdentifier(i)" class="text-accent-danger-500 hover:text-accent-danger-600 p-1">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Tab: Sprachen -->
      <div *ngIf="activeTab() === 'languages'" class="space-y-6 animate-in fade-in slide-in-from-top-2 duration-300">
        <div class="flex justify-between items-center">
          <h4 class="text-sm font-bold text-neutral-800 dark:text-white uppercase tracking-wider">Mehrsprachige Namen
          </h4>
          <button (click)="addTranslation()" class="btn-brand-soft !w-auto !py-1.5 !px-3 text-xs">
            + Übersetzung
          </button>
        </div>

        <div *ngFor="let tr of modalData.translations; let i = index"
          class="space-y-3 p-4 bg-canvas/5 dark:bg-white/5 rounded-2xl border border-canvas/10 dark:border-white/10 relative">
          <button (click)="removeTranslation(i)"
            class="absolute top-2 right-2 text-neutral-400 hover:text-accent-danger-500 p-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>

          <div class="form-group pb-1">
            <label class="form-label text-[10px]">Name in dieser Sprache</label>
            <input type="text" [(ngModel)]="tr.name" placeholder="z.B. Hirschberg" class="form-input !text-sm !py-2">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
              <label class="form-label text-[10px]">ISO-Code</label>
              <input type="text" [(ngModel)]="tr.lang" placeholder="pl, en, ..." class="form-input !text-xs !py-1.5">
            </div>
            <div class="form-group">
              <label class="form-label text-[10px]">Typ / Form</label>
              <input type="text" [(ngModel)]="tr.form" placeholder="Stadt, Dorf, ..."
                class="form-input !text-xs !py-1.5">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
              <label class="form-label text-[10px]">Gültig ab</label>
              <input type="date" [(ngModel)]="tr.dateStart" class="form-input !text-xs !py-1.5">
            </div>
            <div class="form-group">
              <label class="form-label text-[10px]">Gültig bis</label>
              <input type="date" [(ngModel)]="tr.dateEnd" class="form-input !text-xs !py-1.5">
            </div>
          </div>
        </div>

        <div *ngIf="!modalData.translations?.length"
          class="text-center py-10 bg-canvas/5 dark:bg-white/5 rounded-2xl border border-dashed border-canvas/10 dark:border-white/10">
          <p class="text-sm text-neutral-500 italic">Keine weiteren Sprachfassungen vorhanden.</p>
        </div>
      </div>

      <!-- Tab: Position & Struktur -->
      <div *ngIf="activeTab() === 'location'" class="space-y-6 animate-in fade-in slide-in-from-top-2 duration-300">
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <h4 class="text-sm font-bold text-neutral-800 dark:text-white uppercase tracking-wider">Geografische
              Position</h4>
            <button (click)="toggleMap()" class="btn-secondary !w-auto !py-1.5 !px-3 text-xs">
              {{ showMap() ? 'Karte verbergen' : 'Karte laden' }}
            </button>
          </div>

          <div *ngIf="showMap()"
            class="h-64 rounded-2xl overflow-hidden border border-canvas/10 dark:border-white/10 shadow-lg mt-3"
            #mapContainer></div>

          <div class="grid grid-cols-2 gap-5">
            <div class="space-y-1.5">
              <label class="form-label">Breitengrad (Lat) *</label>
              <input type="text" [(ngModel)]="modalData.latitude" class="form-input" placeholder="z.B. 50.218957">
            </div>
            <div class="space-y-1.5">
              <label class="form-label">Längengrad (Lng) *</label>
              <input type="text" [(ngModel)]="modalData.longitude" class="form-input" placeholder="z.B. 15.7362">
            </div>
          </div>

          <div class="flex justify-between items-center text-xs mt-2">
            <button (click)="useMyLocation()" class="text-brand-600 dark:text-brand-400 font-bold hover:underline">📡
              Meinen Standort nutzen</button>
            <span *ngIf="locationLabel()" class="italic text-neutral-500">{{ locationLabel() }}</span>
          </div>
        </div>

        <div class="space-y-5 pt-4 border-t border-canvas/10 dark:border-white/10">
          <h4 class="text-sm font-bold text-neutral-800 dark:text-white uppercase tracking-wider">Struktur & Hierarchie
          </h4>

          <div class="space-y-1.5">
            <label class="form-label">Übergeordneter Ort</label>
            <select [(ngModel)]="modalData.parentId" class="form-input">
              <option value="">— Kein übergeordneter Ort —</option>
              <option *ngFor="let p of parentOptions()" [value]="p.id">{{ p.name }}</option>
            </select>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div class="space-y-1.5">
              <label class="form-label">Ort-Struktur / Form</label>
              <input type="text" [(ngModel)]="modalData.form" class="form-input" placeholder="z.B. Stadt, Landkreis">
            </div>

            <div class="space-y-1.5">
              <label class="form-label">Zusatzinfo / Phrase</label>
              <input type="text" [(ngModel)]="modalData.phrase" class="form-input"
                placeholder="historisch erwähnt als...">
            </div>
          </div>
        </div>
      </div>

      <!-- Tab: Notizen -->
      <div *ngIf="activeTab() === 'notes'" class="space-y-6 animate-in fade-in slide-in-from-top-2 duration-300">
        <app-notes-list [entityId]="initialData?.id || ''" [entityType]="'PLACE'" [notesDisplay]="notes()"
          [allowCreate]="true" [allowEdit]="true" [placeholder]="'Orts-Notizen durchsuchen...'"
          (noteCreateRequested)="onNoteCreateRequested()" (noteEditRequested)="onNoteEditRequested($event)"
          (noteDeleted)="onNoteDeleted($event)"></app-notes-list>
      </div>

      <!-- Tab: Links / Usage -->
      <div *ngIf="activeTab() === 'links'" class="space-y-6 animate-in fade-in slide-in-from-top-2 duration-300">
        <app-usage-list [usages]="usages()" [isLoading]="isLoadingUsage()" [title]="'Verwendungsnachweise'"
          [emptyMessage]="'Dieser Ort wird aktuell nirgends verwendet.'" (linkClick)="closeModal()"></app-usage-list>
      </div>



    </div>
  </div>
</app-modal-shell>

<!-- NOTE EDIT SUB-MODAL -->
<app-modal-shell [visible]="showNoteSubModal()" [title]="activeNoteIndex() !== null ? 'Notiz bearbeiten' : 'Neue Notiz'"
  icon="📝" size="md" [showSave]="true" [showDelete]="activeNoteIndex() !== null" (close)="showNoteSubModal.set(false)"
  (save)="onNoteSave()" (delete)="onNoteDeleteFromModal()">
  <div class="space-y-4">
    <div class="form-group mb-0">
      <label class="form-label">Kategorie / Typ</label>
      <select [(ngModel)]="noteDraft().noteType" class="form-input">
        <option value="COMMENT">Kommentar</option>
        <option value="TRANSCRIPTION">Transkription</option>
        <option value="RESEARCH">Forschung</option>
        <option value="QUESTION">Frage</option>
        <option value="TODO">Aufgabe</option>
        <option value="HINT">Hinweis</option>
        <option value="OTHER">Andere</option>
      </select>
    </div>

    <div class="form-group mb-0">
      <label class="form-label">Inhalt</label>
      <textarea [(ngModel)]="noteDraft().text" class="form-input min-h-[160px] font-body"
        placeholder="Schreibe deine Notiz hier..."></textarea>
    </div>

    <div
      class="flex items-center gap-3 p-3 bg-neutral-50 dark:bg-neutral-900/50 rounded-xl border border-neutral-200 dark:border-neutral-800">
      <div class="flex-1">
        <div class="text-sm font-bold text-neutral-900">Private Notiz</div>
        <div class="text-[10px] text-neutral-500">Nur für dich (und eingeladene Bearbeiter) sichtbar.</div>
      </div>
      <input type="checkbox" [(ngModel)]="noteDraft().isPrivate" class="checkbox checkbox-brand">
    </div>
  </div>
</app-modal-shell>
