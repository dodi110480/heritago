<!-- No own search field here: the page header (app-page-header) owns the search
     and queries the backend (see backend-first rule). -->
<app-list-view [isLoading]="isLoading()" [isEmpty]="placesDisplay().length === 0" loadingText="Lade Orte..."
    emptyIcon="📍" emptyTitle="Keine Orte gefunden" emptySubtitle="Lege deinen ersten Ort an, um zu beginnen.">

    @for (place of flattenHierarchy(placesDisplay()); track place.id) {
        <app-entity-card
            [title]="place.phrase || (place.name | placeDisplay:'short')"
            [subtitle]="place.phrase ? (place.name | placeDisplay:'short') : (place.parentName ? 'Teil von: ' + place.parentName : 'Hauptort / Root')"
            [meta]="(place.lang || place.level) ? '[' + (place.lang || '--') + '] ' + place.level : ((place.latitude && place.longitude) ? 'Koord: ' + place.latitude + ', ' + place.longitude : 'Ort')"
            icon="📍" [style.margin-left.px]="(place.depth || 0) * 16" badgeText="Ort" badgeColor="success"
            [actionBadge]="place.usage?.total > 0 ? place.usage.total + ' Verkn.' : ''"
            [actionBadgeTooltip]="usageTooltip(place)"
            (onClick)="placeEditRequested.emit(place)">
        </app-entity-card>
    }

</app-list-view>
