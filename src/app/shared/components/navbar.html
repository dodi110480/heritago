<nav class="fixed top-0 w-full h-14 md:h-16 z-navbar bg-white/60 dark:bg-slate-950/60 backdrop-blur-2xl border-b border-white/10 shadow-[0_4px_30px_rgba(0,0,0,0.1)] transition-all duration-500"
    *ngIf="authService.isAuthenticated()">
    <div class="max-w-[1400px] mx-auto px-4 h-full flex items-center justify-between">
        <!-- Logo / Back to Dashboard -->
        <a routerLink="/"
            class="flex items-center gap-2 text-canvas-white font-bold text-lg md:text-base hover:text-brand-400 py-2">
            <img src="/favicon.svg" alt="Heritago Logo" class="w-7 h-7 md:w-6 md:h-6 object-contain" />
            <span class="hidden md:block">Heritago</span>
        </a>

        <!-- Desktop Links -->
        <div class="hidden md:flex items-center gap-1">
            <a routerLink="/tree" routerLinkActive="!bg-brand-500/20 !text-brand-500 dark:!text-brand-400 !border-brand-500/40 shadow-brand-sm"
                class="flex items-center gap-2 px-4 py-1.5 rounded-full text-neutral-500 dark:text-neutral-400 hover:bg-brand-500/10 hover:text-brand-500 transition-all font-bold text-sm border border-transparent">
                <app-icon name="tree" size="1.1rem"></app-icon>
                <span>Stammbaum</span>
            </a>
            <a routerLink="/persons" routerLinkActive="!bg-brand-500/20 !text-brand-500 dark:!text-brand-400 !border-brand-500/40 shadow-brand-sm"
                class="flex items-center gap-2 px-4 py-1.5 rounded-full text-neutral-500 dark:text-neutral-400 hover:bg-brand-500/10 hover:text-brand-500 transition-all font-bold text-sm border border-transparent">
                <app-icon name="people" size="1.1rem"></app-icon>
                <span>Personen</span>
            </a>
            <a routerLink="/families" routerLinkActive="!bg-brand-500/20 !text-brand-500 dark:!text-brand-400 !border-brand-500/40 shadow-brand-sm"
                class="flex items-center gap-2 px-4 py-1.5 rounded-full text-neutral-500 dark:text-neutral-400 hover:bg-brand-500/10 hover:text-brand-500 transition-all font-bold text-sm border border-transparent">
                <app-icon name="family" size="1.1rem"></app-icon>
                <span>Familien</span>
            </a>
            <a routerLink="/media" routerLinkActive="!bg-brand-500/20 !text-brand-500 dark:!text-brand-400 !border-brand-500/40 shadow-brand-sm"
                class="flex items-center gap-2 px-4 py-1.5 rounded-full text-neutral-500 dark:text-neutral-400 hover:bg-brand-500/10 hover:text-brand-500 transition-all font-bold text-sm border border-transparent">
                <app-icon name="media" size="1.1rem"></app-icon>
                <span>Medien</span>
            </a>
            <a routerLink="/sources" routerLinkActive="!bg-brand-500/20 !text-brand-500 dark:!text-brand-400 !border-brand-500/40 shadow-brand-sm"
                class="flex items-center gap-2 px-4 py-1.5 rounded-full text-neutral-500 dark:text-neutral-400 hover:bg-brand-500/10 hover:text-brand-500 transition-all font-bold text-sm border border-transparent">
                <app-icon name="source" size="1.1rem"></app-icon>
                <span>Quellen</span>
            </a>
            <a routerLink="/places" routerLinkActive="!bg-brand-500/20 !text-brand-500 dark:!text-brand-400 !border-brand-500/40 shadow-brand-sm"
                class="flex items-center gap-2 px-4 py-1.5 rounded-full text-neutral-500 dark:text-neutral-400 hover:bg-brand-500/10 hover:text-brand-500 transition-all font-bold text-sm border border-transparent">
                <app-icon name="place" size="1.1rem"></app-icon>
                <span>Orte</span>
            </a>
        </div>

        <!-- User / Logout / Settings -->
        <div class="flex items-center gap-2 md:gap-4 md:ml-auto">
            <!-- Diagnostics Notification -->
            <a routerLink="/diagnostics"
                class="relative p-2 rounded-full transition-all duration-300 flex items-center justify-center group"
                [class.text-accent-danger-500]="errorCount() > 0"
                [class.text-amber-500]="errorCount() === 0 && warningCount() > 0"
                [class.bg-accent-danger-500\/10]="errorCount() > 0"
                [class.bg-amber-500\/10]="errorCount() === 0 && warningCount() > 0"
                title="Fehlerdiagnose" *ngIf="errorCount() > 0 || warningCount() > 0">
                
                <!-- Red Triangle for Errors -->
                <svg *ngIf="errorCount() > 0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 animate-pulse-slow">
                    <path d="M12 2L1 21h22L12 2zM12 6l7.53 13H4.47L12 6zm-1 4v4h2v-4h-2zm0 6v2h2v-2h-2z"/>
                </svg>

                <!-- Warning Icon for only warnings -->
                <app-icon *ngIf="errorCount() === 0 && warningCount() > 0" name="diagnostics" size="1.25rem"></app-icon>

                <span *ngIf="errorCount() > 0"
                    class="absolute -top-1 -right-1 bg-accent-danger-600 text-white text-[10px] min-w-[18px] h-[18px] px-1 flex items-center justify-center rounded-full font-bold shadow-lg ring-2 ring-white dark:ring-slate-900 z-10">
                    {{ errorCount() }}
                </span>
                <span *ngIf="errorCount() === 0 && warningCount() > 0"
                    class="absolute -top-1 -right-1 bg-amber-600 text-white text-[10px] min-w-[18px] h-[18px] px-1 flex items-center justify-center rounded-full font-bold shadow-lg ring-2 ring-white dark:ring-slate-900 z-10">
                    {{ warningCount() }}
                </span>
            </a>

            <span class="hidden lg:block text-neutral-400 font-medium text-sm">{{ authService.currentUser()?.username
                }}</span>
            <a routerLink="/settings"
                class="hidden md:flex text-neutral-400 hover:text-brand-400 p-2 hover:bg-brand-500/10 rounded-full transition-colors items-center justify-center"
                title="Einstellungen">
                <app-icon name="settings" size="1.25rem"></app-icon>
            </a>
            <button (click)="logout()"
                class="hidden md:flex text-neutral-400 hover:text-accent-danger-400 p-2 hover:bg-accent-danger-500/10 rounded-full transition-colors items-center justify-center"
                title="Ausloggen">
                <app-icon name="logout" size="1.25rem"></app-icon>
            </button>
            <button class="md:hidden text-neutral-400 p-2 hover:bg-neutral-500/10 rounded-lg transition-colors" (click)="toggleMobileMenu()" title="Menü">
                <svg *ngIf="!isMobileMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                <svg *ngIf="isMobileMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
    </div>
</nav>

<!-- Mobile Navigation Overlay (Extracted for viewport positioning) -->
<div *ngIf="authService.isAuthenticated() && isMobileMenuOpen()" 
     class="fixed inset-x-0 bottom-0 top-14 bg-canvas/95 backdrop-blur-2xl z-navbar flex flex-col p-6 overflow-y-auto animate-fade-in md:hidden border-t border-neutral-200/10 shadow-2xl">
    
    <div class="flex flex-col gap-2 mt-4">
        <a routerLink="/tree" class="mobile-nav-link" routerLinkActive="active">
            <app-icon name="tree" size="1.25rem"></app-icon>
            <span>Stammbaum</span>
        </a>
        <a routerLink="/persons" class="mobile-nav-link" routerLinkActive="active">
            <app-icon name="people" size="1.25rem"></app-icon>
            <span>Personen</span>
        </a>
            <a routerLink="/families" class="mobile-nav-link" routerLinkActive="active">
            <app-icon name="family" size="1.25rem"></app-icon>
            <span>Familien</span>
        </a>
        <a routerLink="/media" class="mobile-nav-link" routerLinkActive="active">
            <app-icon name="media" size="1.25rem"></app-icon>
            <span>Medien</span>
        </a>
        <a routerLink="/sources" class="mobile-nav-link" routerLinkActive="active">
            <app-icon name="source" size="1.25rem"></app-icon>
            <span>Quellen</span>
        </a>
        <a routerLink="/places" class="mobile-nav-link" routerLinkActive="active">
            <app-icon name="place" size="1.25rem"></app-icon>
            <span>Orte</span>
        </a>

        <div class="h-px bg-neutral-200/10 my-4"></div>

        <a routerLink="/settings" class="mobile-nav-link !text-brand-400" routerLinkActive="active">
            <app-icon name="settings" size="1.25rem"></app-icon>
            <span>Einstellungen</span>
        </a>
        <button (click)="logout()" class="mobile-nav-link !text-accent-danger-400">
            <app-icon name="logout" size="1.25rem"></app-icon>
            <span>Abmelden</span>
        </button>
    </div>

    <div class="mt-auto py-8 text-center">
        <p class="text-neutral-500 text-xs font-medium tracking-widest uppercase">Eingeloggt als</p>
        <p class="text-brand-400 font-bold mt-1">{{ authService.currentUser()?.username }}</p>
    </div>
</div>
