<app-page-header title="Ortsverzeichnis" 
    [description]="'Alle registrierten Orte in ' + (currentTree() || 'diesem Stammbaum')"
    [showSearch]="true"
    searchPlaceholder="Nach Orten suchen..."
    [searchTerm]="searchTerm()"
    (searchTermChange)="searchTerm.set($event)">
    <div actions class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">


        <button class="btn-primary flex-shrink-0 w-full md:w-auto !py-2" (click)="openAddModal()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Neuer Ort</span>
        </button>
    </div>
</app-page-header>

<!-- CONTENT -->
<app-places-list 
    [placesDisplay]="hierarchy()" 
    [isLoading]="loading()"
    (placeEditRequested)="openEditModal($event)" 
    (placeCreateRequested)="openAddModal()">
</app-places-list>

<app-place-modal [visible]="isModalOpen()" [mode]="modalMode()" [initialData]="selectedPlaceData()" (saved)="onPlaceSaved()"
    (closed)="closeModal()" (deleted)="onPlaceDeleted()" (merged)="onPlaceMerged()">
</app-place-modal>
