<ng-container *ngIf="!store.loading() && store.family()">
    <app-page-header [title]="'Familie ' + store.family()?.id"
        [description]="store.getPersonName(store.family()?.husband) + ' & ' + store.getPersonName(store.family()?.wife) + (store.getMarriageInfo() ? ' — ' + store.getMarriageInfo() : '')">
        <div actions></div>
    </app-page-header>

    <!-- Tab Navigation -->
    <div
        class="flex gap-2 overflow-x-auto pb-4 mb-6 border-b border-canvas/5 no-scrollbar animate-in slide-in-from-top-4 duration-[180ms]">
        <button *ngFor="let tab of [
            {id: 'basics', label: 'Allgemeines'},
            {id: 'children', label: 'Kinder'},
            {id: 'events', label: 'Ereignisse'},
            {id: 'notes', label: 'Notizen'},
            {id: 'citations', label: 'Quellen'},
            {id: 'media', label: 'Medien'}
        ]" (click)="store.setActiveTab(tab.id)"
            [class]="store.activeTab() === tab.id ? 
            'px-4 py-2 rounded-lg bg-brand-500/10 text-brand-600 border border-brand-500/20 text-sm font-semibold whitespace-nowrap shadow-sm' : 
            'px-4 py-2 rounded-lg hover:bg-canvas/5 text-neutral-500 hover:text-neutral-900 dark:hover:text-white text-sm font-medium transition-all duration-[180ms] whitespace-nowrap'">
            {{tab.label}}
        </button>
    </div>

    <div class="space-y-8 animate-in fade-in duration-500 pb-20">

        <!-- Tab: Basics -->
        <div *ngIf="store.activeTab() === 'basics'" class="space-y-6">
            <app-family-tab-basics 
                [family]="store.family()" 
                [husband]="store.getPersonById(store.family()?.husband)"
                [wife]="store.getPersonById(store.family()?.wife)">
            </app-family-tab-basics>
        </div>

        <div *ngIf="store.activeTab() === 'children'" class="space-y-6">
            <app-family-tab-children
                [family]="store.family()"
                [children]="store.familyChildren()"
                (addChildRequested)="openAddChildModal()"
                (removeChildRequested)="removeChild($event)">
            </app-family-tab-children>
        </div>

        <!-- Tab: Ereignisse -->
        <div *ngIf="store.activeTab() === 'events'" class="space-y-6">
            <app-family-tab-events
                [family]="store.family()"
                (addEventRequested)="openAddEventModal()"
                (editEventRequested)="openEditEventModal($event)"
                (removeEventRequested)="removeEvent($event)">
            </app-family-tab-events>
        </div>

        <!-- Tab: Notizen -->
        <div *ngIf="store.activeTab() === 'notes'" class="space-y-6 animate-in fade-in slide-in-from-top-2 duration-300">
            <div class="glass-card shadow-sm flex flex-col">
                <div class="p-0">
                    <app-section-header title="Notizen" icon="📝">
                        <div actions class="flex items-center gap-3">
                            <div class="relative hidden md:block w-64">
                                <input 
                                    type="text" 
                                    [ngModel]="noteSearchQuery()"
                                    (ngModelChange)="noteSearchQuery.set($event)"
                                    placeholder="Notizen durchsuchen..."
                                    class="w-full bg-white dark:bg-neutral-900/50 border border-neutral-200 dark:border-neutral-800 rounded-btn pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-all font-medium"
                                >
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                </span>
                            </div>
                            <button (click)="onNoteCreateRequested()" class="btn-primary !w-auto !py-2">
                                + Notiz
                            </button>
                        </div>
                    </app-section-header>

                    <app-notes-list [entityId]="store.familyId() || ''" [entityType]="'FAMILY'" [notesDisplay]="store.family()?.notes || []"
                        [allowCreate]="true" [allowEdit]="true" [showHeader]="false" [searchTerm]="noteSearchQuery()"
                        (noteCreateRequested)="onNoteCreateRequested()" (noteEditRequested)="onNoteEditRequested($event)"
                        (noteDeleted)="onNoteDeletedFamily($event)"></app-notes-list>
                </div>
            </div>
        </div>

        <!-- Tab: Quellen -->
        <div *ngIf="store.activeTab() === 'citations'" class="space-y-6 animate-in fade-in slide-in-from-top-2 duration-300">
            <div class="glass-card shadow-sm flex flex-col">
                <div class="p-0">
                    <app-section-header title="Quellen" icon="📖">
                        <div actions class="flex items-center gap-3">
                            <div class="relative hidden md:block w-64">
                                <input 
                                    type="text" 
                                    [ngModel]="sourceSearchQuery()"
                                    (ngModelChange)="sourceSearchQuery.set($event)"
                                    placeholder="Quellen durchsuchen..."
                                    class="w-full bg-white dark:bg-neutral-900/50 border border-neutral-200 dark:border-neutral-800 rounded-btn pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-all font-medium"
                                >
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                </span>
                            </div>
                            <button (click)="onSourceCreateRequested()" class="btn-primary !w-auto !py-2">
                                + Beleg
                            </button>
                        </div>
                    </app-section-header>

                    <app-sources-list
                        [entityId]="store.familyId() || ''"
                        entityType="FAMILY"
                        [sourcesDisplay]="mappedSources()"
                        [allowCreate]="true"
                        [allowEdit]="true"
                        [showHeader]="false"
                        [searchTerm]="sourceSearchQuery()"
                        (sourceCreateRequested)="onSourceCreateRequested()"
                        (sourceEditRequested)="onSourceEditRequested($event)"
                        (masterSaved)="store.loadAvailableSources()">
                    </app-sources-list>
                </div>
            </div>
        </div>

        <!-- Tab: Medien -->
        <div *ngIf="store.activeTab() === 'media'" class="space-y-6">
            <div class="glass-card !p-6 sm:!p-8 flex flex-col gap-6">
                <app-section-header title="Medien" icon="🖼">
                    <div actions class="flex gap-2">
                        <button (click)="openMediaAddModal()" class="btn-primary !w-auto !py-1.5 text-sm">+
                            Upload</button>
                        <button (click)="openMediaSelector()"
                            class="btn-secondary !w-auto !py-1.5 text-sm">Galerie</button>
                    </div>
                </app-section-header>

                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
                    *ngIf="store.family()?.media?.length">
                    <div *ngFor="let med of store.family()?.media; let i = index" (click)="openEditMediaModal(i)"
                        class="glass-card !p-0 !rounded-2xl overflow-hidden group hover:scale-[1.02] transition-transform cursor-pointer border border-canvas/10 dark:border-white/10">
                        <div
                            class="aspect-video bg-canvas/10 dark:bg-white/10 relative flex items-center justify-center overflow-hidden">
                            <img *ngIf="isImageUrl(med.url)" [src]="med.url" class="w-full h-full object-cover">
                            <div *ngIf="!isImageUrl(med.url)" class="text-neutral-400 dark:text-neutral-500">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                                    <polyline points="13 2 13 9 20 9"></polyline>
                                </svg>
                            </div>
                            <div
                                class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-xs font-bold">
                                Klicken zum Bearbeiten
                            </div>
                        </div>
                        <div class="p-3">
                            <p class="text-xs font-bold text-neutral-900 dark:text-white truncate">{{ med.title || 'Ohne
                                Titel' }}</p>
                            <p class="text-[10px] text-neutral-500 dark:text-neutral-400 mt-0.5 truncate">{{ med.url }}
                            </p>
                        </div>
                    </div>
                </div>

                <app-empty-state *ngIf="!store.family()?.media || store.family()?.media?.length === 0" icon="🖼"
                    title="Keine Medien" message="Lade Bilder, Urkunden oder andere Dokumente hoch.">
                </app-empty-state>
            </div>
        </div>

    </div>

    <!-- MODALS -->

    <!-- Media Modal -->
    <app-modal-shell [visible]="showMediaModal()"
        [title]="activeMediaIndex() !== null ? 'Medium bearbeiten' : 'Neues Medium'" icon="🖼" size="md"
        [showSave]="true" (close)="showMediaModal.set(false)" (save)="confirmSaveMedia()">
        <div *ngIf="mediaDraft() as draft" class="space-y-4">
            <div class="form-group">
                <label class="form-label">Titel</label>
                <input type="text" [(ngModel)]="draft.title" class="form-input" placeholder="z.B. Hochzeitsurkunde">
            </div>
            <div class="form-group">
                <label class="form-label">URL / Dateipfad</label>
                <input type="text" [(ngModel)]="draft.url" class="form-input"
                    placeholder="https://... oder path/to/file">
            </div>
            <div class="flex items-center gap-3 p-3 bg-canvas/5 dark:bg-white/5 rounded-xl border border-canvas/10 dark:border-white/10"
                *ngIf="isImageUrl(draft.url)">
                <img [src]="draft.url" class="w-20 h-20 object-cover rounded-lg border border-canvas/20">
                <span class="text-xs text-neutral-500 dark:text-neutral-400">Vorschau</span>
            </div>
            <div class="flex items-center gap-2">
                <input type="checkbox" [(ngModel)]="draft.isPrimary" id="isPrimary"
                    class="rounded border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900/50">
                <label for="isPrimary" class="text-sm text-neutral-700 dark:text-neutral-300">Als Hauptbild
                    verwenden</label>
            </div>

            <div class="pt-4 flex justify-end" *ngIf="activeMediaIndex() !== null">
                <button (click)="removeMedia(activeMediaIndex()!)"
                    class="text-accent-danger-500 text-sm hover:underline">Medium löschen</button>
            </div>
        </div>
    </app-modal-shell>

    <app-media-selector [visible]="showMediaSelector" (selected)="onMediaSelected($event)"
        (closed)="showMediaSelector = false">
    </app-media-selector>

    <app-media-add-modal [visible]="showMediaAddModal()" [treeId]="authService.currentTree()?.name || ''"
        (closed)="showMediaAddModal.set(false)" (saved)="onMediaAddUploaded($event)" (masterSaved)="store.loadAvailableSources()">
    </app-media-add-modal>

    <app-image-viewer [url]="viewerUrl()" [title]="viewerTitle()" (closed)="viewerUrl.set(null)"></app-image-viewer>

    <!-- Event Modal (reusable component) -->
    <app-event-modal [visible]="showEventModal()" [item]="eventDraft()" [isNew]="activeEventIndex() === null"
        [availableSources]="store.availableSources()"
        [allPersonsOptions]="allPersonsOptions()" [showDelete]="activeEventIndex() !== null"
        (close)="showEventModal.set(false)" (save)="confirmSaveEvent()" (delete)="removeEvent(activeEventIndex()!)"
        (addCitation)="addEventCitation()" (removeCitation)="removeEventCitation($event)"
        (openUpload)="openMediaAddModal()" (openGallery)="openMediaSelector()" (addNote)="addEventNote()"
        (removeNote)="removeEventNote($event)" (addMedia)="addEventMedia()" (removeMedia)="removeEventMedia($event)"
        (openViewer)="openViewer($event)" (masterSaved)="store.loadAvailableSources()">
    </app-event-modal>

    <!-- Globaler Place Modal Integration -->
    <app-place-modal [visible]="showPlaceModal()" mode="add" (closed)="showPlaceModal.set(false)"
        (saved)="onPlaceSaved($event)"></app-place-modal>

    <!-- Note Modal -->
    <app-modal-shell [visible]="showNoteModal()"
        [title]="activeNoteIndex() !== null ? 'Notiz bearbeiten' : 'Neue Notiz'" icon="📝" size="md" [showSave]="true"
        [showDelete]="activeNoteIndex() !== null" (close)="showNoteModal.set(false)" (save)="onNoteSave()"
        (delete)="onNoteDeleteFromModal()">
        <div *ngIf="noteDraft() as draft" class="space-y-4">
            <div class="form-group mb-0">
                <label class="form-label text-xs uppercase tracking-wider font-bold text-neutral-500">Kategorie /
                    Typ</label>
                <select [(ngModel)]="draft.noteType" class="form-input">
                    <option value="COMMENT">Kommentar</option>
                    <option value="TRANSCRIPTION">Transkription</option>
                    <option value="RESEARCH">Forschung</option>
                    <option value="QUESTION">Frage</option>
                    <option value="TODO">Aufgabe</option>
                    <option value="HINT">Hinweis</option>
                    <option value="OTHER">Andere</option>
                </select>
            </div>

            <div class="form-group mb-0">
                <label class="form-label text-xs uppercase tracking-wider font-bold text-neutral-500">Inhalt</label>
                <textarea [(ngModel)]="draft.text" class="form-input min-h-[160px] font-body"
                    placeholder="Schreibe deine Notiz hier..."></textarea>
            </div>

            <div
                class="flex items-center gap-3 p-3 bg-neutral-50 dark:bg-neutral-900/50 rounded-xl border border-neutral-200 dark:border-neutral-800">
                <div class="flex-1">
                    <div class="text-sm font-bold text-neutral-900 dark:text-white">Private Notiz</div>
                    <div class="text-[10px] text-neutral-500">Nur für dich sichtbar.</div>
                </div>
                <input type="checkbox" [(ngModel)]="draft.isPrivate" class="checkbox checkbox-brand shadow-sm">
            </div>
        </div>
    </app-modal-shell>

    <!-- Kind hinzufügen Modal -->
    <app-modal-shell [visible]="showAddChildModal()" title="Kind hinzufügen" icon="👶" size="sm" [showSave]="true"
        saveText="Verknüpfen" (close)="showAddChildModal.set(false)" (save)="confirmAddChild()">
        <div class="space-y-4">
            <div class="form-group">
                <label class="form-label">Name oder ID</label>
                <input type="text" [(ngModel)]="addChildQuery" class="form-input" placeholder="z.B. I001..." autofocus>
            </div>
            <div *ngIf="addChildResults().length > 0" class="space-y-2">
                <label class="form-label">Treffer</label>
                <div class="flex flex-col gap-1 max-h-48 overflow-y-auto">
                    <button *ngFor="let c of addChildResults()" (click)="selectChildCandidate(c)"
                        [class]="selectedChildId() === c.id ? 'btn-brand-soft !justify-start !text-left' : 'btn-ghost !justify-start !text-left text-sm'">
                        {{ c.firstName }} {{ c.lastName }} ({{ c.id }})
                    </button>
                </div>
            </div>
            <p *ngIf="addChildError()" class="text-xs text-accent-danger-500 bg-accent-danger-500/10 p-2 rounded-lg">{{
                addChildError() }}</p>
        </div>
    </app-modal-shell>


    <!-- Abbrechen Bestätigen Modal -->
    <app-modal-shell [visible]="showCancelConfirmModal()" title="Änderungen verwerfen?" icon="⚠️" size="sm"
        [showSave]="false" [showDelete]="true" deleteText="Ja, verwerfen" (close)="showCancelConfirmModal.set(false)"
        (delete)="confirmCancel()">
        <p class="p-4 text-neutral-600 dark:text-neutral-300 text-center">Möchten Sie alle ungespeicherten Änderungen
            wirklich verwerfen?</p>
    </app-modal-shell>

    <!-- Source Modal -->
    <app-modal-shell [visible]="showSourceModal()" 
        [title]="activeSourceIndex() !== null ? 'Beleg bearbeiten' : 'Beleg hinzufügen'" 
        icon="📖" 
        size="md" 
        [showSave]="true"
        [showDelete]="activeSourceIndex() !== null" 
        [saveText]="activeSourceIndex() !== null ? 'Speichern' : 'Hinzufügen'"
        (close)="showSourceModal.set(false)" 
        (save)="onSourceSave()" 
        (delete)="onSourceDeleteFromModal()">
        
        <div *ngIf="sourceDraft() as draft" class="space-y-4">
            <div class="form-group mb-0">
                <label class="form-label text-[10px]">Quelle</label>
                <select [(ngModel)]="draft.sourceId" class="form-input !py-1.5 text-sm">
                    <option value="">— Quelle wählen —</option>
                    <option *ngFor="let s of store.availableSources()" [value]="s.id">
                        {{ s.title }}{{ s.author ? ' · ' + s.author : '' }}
                    </option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div class="form-group mb-0">
                    <label class="form-label text-[10px]">Seite/Ort</label>
                    <input type="text" [(ngModel)]="draft.whereInSource" class="form-input !py-1.5 text-sm" placeholder="z.B. S. 12">
                </div>
                <div class="form-group mb-0">
                    <label class="form-label text-[10px]">Datum im Beleg</label>
                    <input type="text" [(ngModel)]="draft.date" class="form-input !py-1.5 text-sm" placeholder="z.B. 1900">
                </div>
            </div>
            <div class="form-group mb-0">
                <label class="form-label text-[10px]">Qualität</label>
                <select [(ngModel)]="draft.confidence" class="form-input !py-1.5 text-sm">
                    <option value="">Wählen...</option>
                    <option value="CERTAIN">Sicher (3)</option>
                    <option value="VERY_LIKELY">Sehr wahrscheinlich (2)</option>
                    <option value="LIKELY">Wahrscheinlich (1)</option>
                    <option value="UNLIKELY">Unzuverlässig (0)</option>
                </select>
            </div>
            <div class="form-group mb-0">
                <label class="form-label text-[10px]">Zitat / Ausschnitt</label>
                <textarea [(ngModel)]="draft.text" 
                    class="form-input !py-1.5 text-sm min-h-[80px]"
                    placeholder="Zitierter Text"></textarea>
            </div>
        </div>
    </app-modal-shell>

</ng-container>

<!-- Loading Overlay -->
<div class="fixed inset-0 bg-canvas/80 dark:bg-canvas-dark/80 backdrop-blur-sm z-[1000] flex flex-col items-center justify-center gap-4"
    *ngIf="store.loading()">
    <div class="w-10 h-10 border-4 border-brand-500/20 border-t-brand-500 rounded-full animate-spin"></div>
    <p class="text-neutral-700 dark:text-neutral-200 font-medium tracking-wide">Lade Familiendetails...</p>
</div>
