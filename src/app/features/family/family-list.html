<app-page-header title="Familien-Übersicht" 
    [description]="treeName() ? 'Stammbaum: ' + treeName() : ''"
    [showSearch]="true"
    searchPlaceholder="Nach Namen suchen..."
    [searchTerm]="searchTerm()"
    (searchTermChange)="searchTerm.set($event)"
    [showSort]="true"
    [showSortDirection]="true"
    [sortOptions]="sortOptions"
    [sortValue]="sortMode()"
    (sortValueChange)="sortMode.set($event)"
    [sortDirection]="sortDirection()"
    (sortDirectionChange)="sortDirection.set($event)">
    <div actions class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
    </div>
</app-page-header>

<!-- CONTENT -->
<app-list-view
    [isLoading]="loading()"
    [isEmpty]="filteredFamilies().length === 0"
    loadingText="Lade Familien-Archiv..."
    emptyIcon="👨‍👩‍👧‍👦"
    emptyTitle="Keine Familien gefunden"
    emptySubtitle="Probiere es mit einem anderen Suchbegriff.">

    <app-entity-card *ngFor="let fam of filteredFamilies()"
        [title]="fam.displayName || 'Unbekannte Familie'"
        [subtitle]="fam.statusIcon + ' ' + (fam.marriageLabel || 'Keine Daten')"
        [meta]="(fam.marriageSubtypeLabels || []).join(', ')" 
        [avatarUrl]="fam.profileImageUrl" 
        [gender]="fam.gender || 'U'"
        [actionBadge]="fam.childrenCount ? fam.childrenCount + ' ' + (fam.childrenCount === 1 ? 'Kind' : 'Kinder') : ''"
        [actionBadgeTooltip]="getChildrenTooltip(fam)"
        badgeText="Familie" badgeColor="highlight" [routerLink]="['/family', fam.id]">
    </app-entity-card>

</app-list-view>
