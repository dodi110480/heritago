<app-page-header title="Medien-Galerie" description="Zentral verwalten, bearbeiten und verknüpfen">
  <div actions class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
    <!-- Suche -->
    <div class="search-wrapper">
      <div class="search-icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <input type="text" [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)"
        (keyup.enter)="loadMedia()" placeholder="Name, ID..." class="search-input">
    </div>

    <div class="flex items-center gap-2 w-full md:w-auto">
      <!-- Aktualisiern Button entfernt auf Wunsch -->
      <button class="btn-primary flex-1 md:flex-none !py-2.5" (click)="showAddModal.set(true)">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Medium hochladen</span>
      </button>
    </div>
  </div>
</app-page-header>

<!-- Statistics Row -->
<section
  class="glass-card mb-8 !py-4 flex flex-wrap items-center justify-around gap-6 border-brand-500/10 bg-ui-card/40 backdrop-blur-md">
  <div class="flex flex-col items-center gap-1">
    <span class="text-neutral-500 text-[10px] font-bold uppercase tracking-[0.2em]">Gesamt</span>
    <strong class="text-2xl text-neutral-900 font-black tracking-tight">{{ stats().total }}</strong>
  </div>
  <div class="w-px h-8 bg-neutral-200/50 hidden sm:block"></div>
  <div class="flex flex-col items-center gap-1">
    <span class="text-neutral-500 text-[10px] font-bold uppercase tracking-[0.2em]">Fotos</span>
    <strong class="text-2xl text-brand-500 font-black tracking-tight">{{ stats().fotos }}</strong>
  </div>
  <div class="w-px h-8 bg-neutral-200/50 hidden sm:block"></div>
  <div class="flex flex-col items-center gap-1">
    <span class="text-neutral-500 text-[10px] font-bold uppercase tracking-[0.2em]">Dokumente</span>
    <strong class="text-2xl text-brand-500 font-black tracking-tight">{{ stats().docs }}</strong>
  </div>
  <div class="w-px h-8 bg-neutral-200/50 hidden sm:block"></div>
  <div class="flex flex-col items-center gap-1">
    <span class="text-neutral-500 text-[10px] font-bold uppercase tracking-[0.2em]">Unverknüpft</span>
    <strong class="text-2xl text-accent-danger-500 font-black tracking-tight">{{ stats().unlinked }}</strong>
  </div>
</section>

<!-- Tabs + View Toggle -->
<div class="flex items-center justify-between mb-6 border-b border-neutral-200">
  <div class="flex gap-8 overflow-x-auto no-scrollbar">
    <button class="pb-4 text-sm font-bold uppercase tracking-widest transition-all relative"
      [class.text-brand-500]="filterType() === 'ALLE'" [class.text-neutral-500]="filterType() !== 'ALLE'"
      (click)="filterType.set('ALLE'); loadMedia()">
      Alle
      <div *ngIf="filterType() === 'ALLE'" class="absolute bottom-0 left-0 w-full h-0.5 bg-brand-500"></div>
    </button>
    <button class="pb-4 text-sm font-bold uppercase tracking-widest transition-all relative"
      [class.text-brand-500]="filterType() === 'FOTOS'" [class.text-neutral-500]="filterType() !== 'FOTOS'"
      (click)="filterType.set('FOTOS'); loadMedia()">
      Fotos
      <div *ngIf="filterType() === 'FOTOS'" class="absolute bottom-0 left-0 w-full h-0.5 bg-brand-500"></div>
    </button>
    <button class="pb-4 text-sm font-bold uppercase tracking-widest transition-all relative"
      [class.text-brand-500]="filterType() === 'DOKUMENTE'" [class.text-neutral-500]="filterType() !== 'DOKUMENTE'"
      (click)="filterType.set('DOKUMENTE'); loadMedia()">
      Dokumente
      <div *ngIf="filterType() === 'DOKUMENTE'" class="absolute bottom-0 left-0 w-full h-0.5 bg-brand-500"></div>
    </button>
    <button class="pb-4 text-sm font-bold uppercase tracking-widest transition-all relative"
      [class.text-brand-500]="filterType() === 'UNLINKED'" [class.text-neutral-500]="filterType() !== 'UNLINKED'"
      (click)="filterType.set('UNLINKED'); loadMedia()">
      Ohne Zuordnung
      <div *ngIf="filterType() === 'UNLINKED'" class="absolute bottom-0 left-0 w-full h-0.5 bg-brand-500"></div>
    </button>
  </div>

  <div class="flex items-center gap-1 pb-4 ml-4">
    <button (click)="viewMode.set('grid')"
      class="p-2 rounded-lg transition-all"
      [class.bg-brand-500/10]="viewMode() === 'grid'"
      [class.text-brand-500]="viewMode() === 'grid'"
      [class.text-neutral-400]="viewMode() !== 'grid'"
      title="Rasteransicht">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
    </button>
    <button (click)="viewMode.set('list')"
      class="p-2 rounded-lg transition-all"
      [class.bg-brand-500/10]="viewMode() === 'list'"
      [class.text-brand-500]="viewMode() === 'list'"
      [class.text-neutral-400]="viewMode() !== 'list'"
      title="Listenansicht">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
    </button>
  </div>
</div>

<!-- CONTENT: Grid View -->
<div *ngIf="viewMode() === 'grid'">
  <app-list-view
    [isLoading]="loading()"
    [isEmpty]="filteredItems().length === 0"
    loadingText="Lade Medien..."
    emptyIcon="🖼️"
    emptyTitle="Keine Medien gefunden"
    emptySubtitle="Lade dein erstes Foto oder Dokument hoch.">

    <!-- Media Grid -->
    <app-entity-card *ngFor="let item of filteredItems()" 
      [title]="item.title || 'Unbenanntes Medium'"
      [subtitle]="item.mediaType === 'PHOTO' ? 'Foto' : (item.mediaType === 'DOCUMENT' ? 'Dokument' : '')"
      [avatarUrl]="isImage(item) ? item.previewUrl : undefined"
      [icon]="!isImage(item) ? (isPdf(item) ? '📄' : '📎') : undefined"
      [class.ring-2]="selected()?.id === item.id" [class.ring-brand-500]="selected()?.id === item.id"
      [class.rounded-3xl]="selected()?.id === item.id" (onClick)="openDetails(item)">

      <div actions class="flex flex-col items-end gap-1.5">
        <span *ngIf="item.links?.length; else noLinksSpan"
          class="text-[10px] px-2 py-0.5 rounded bg-brand-500/10 text-brand-400 font-bold border border-brand-500/10 whitespace-nowrap">
          {{ item.links.length }} Link{{ item.links.length !== 1 ? 's' : '' }}
        </span>
        <ng-template #noLinksSpan>
          <span
            class="text-[9px] px-2 py-0.5 rounded bg-accent-danger-500/10 text-accent-danger-400 font-black border border-accent-danger-500/20 whitespace-nowrap uppercase">
            Unlinked
          </span>
        </ng-template>

        <span *ngIf="item.orphanFile"
          class="text-[9px] px-1.5 py-0.5 rounded bg-accent-danger-500/20 text-accent-danger-400 font-bold whitespace-nowrap uppercase">
          Orphan
        </span>

        <span *ngIf="item.fileMissing"
          class="text-[9px] px-1.5 py-0.5 rounded bg-accent-danger-500 text-canvas-white font-black whitespace-nowrap uppercase shadow-sm">
          Datei fehlt
        </span>
      </div>
    </app-entity-card>

  </app-list-view>
</div>

<!-- CONTENT: List View -->
<div *ngIf="viewMode() === 'list'">
  <app-media-list
    [entityId]="treeId() || 'gallery'"
    [entityType]="'MEDIA'"
    [mediaDisplay]="displayMediaList()"
    [allowCreate]="false"
    [showHeader]="false"
    [showPrimaryToggle]="false"
    (mediaEditRequested)="openDetails($event)"
    (viewerRequested)="openDetails($event)"
    (mediaDeleted)="deleteMedia({ id: $event })"
  ></app-media-list>
</div>

<!-- Unified Media Modal -->
<app-media-add-modal
  [visible]="showAddModal() || selected() !== null"
  [treeId]="treeId() || ''"
  [item]="selected()"
  (closed)="closeAddModal(); closeDetails(); loadMedia()"
  (saved)="loadMedia()">
</app-media-add-modal>
