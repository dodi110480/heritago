<div *ngIf="store.person() as p" (input)="store.markDirty()">
    <app-page-header [title]="p.firstName + ' ' + p.lastName"
        [description]="(p.birthDate | cleanDate) + ' - ' + (p.deathDate | cleanDate)">
        <div actions></div>
    </app-page-header>

    <div
        class="flex gap-2 overflow-x-auto pb-4 mb-6 border-b border-canvas/5 no-scrollbar animate-in slide-in-from-top-4 duration-[180ms]">
        <button *ngFor="let tab of [
            {id: 'basics', label: 'Allgemeines'},
            {id: 'timeline', label: 'Lebenslauf'},
            {id: 'relations', label: 'Familie'},
            {id: 'dna', label: 'DNA'},
            {id: 'media', label: 'Medien'},
            {id: 'notes', label: 'Notizen'},
            {id: 'citations', label: 'Quellen'}
        ]" (click)="store.setActiveTab(tab.id)"
            [class]="store.activeTab() === tab.id ? 
            'px-4 py-2 rounded-lg bg-brand-500/10 text-brand-600 border border-brand-500/20 text-sm font-semibold whitespace-nowrap shadow-sm' : 
            'px-4 py-2 rounded-lg hover:bg-canvas/5 text-neutral-500 hover:text-neutral-900 text-sm font-medium transition-all duration-[180ms] whitespace-nowrap'">
            {{tab.label}}
        </button>
    </div>

    <div class="space-y-8 animate-in fade-in duration-500 pb-20">

        <!-- Tab: Basics -->
        <div *ngIf="store.activeTab() === 'basics'" class="space-y-6">
            <app-person-tab-basics 
                [person]="p" 
                [profileImageUrl]="store.profileImageUrl()" 
                [participations]="store.participations()"
                (changed)="store.markDirty(); store.savePerson()"
                (mediaTabRequested)="store.setActiveTab('media')"
                (deleteRequested)="openDeleteModal()">
            </app-person-tab-basics>
        </div>

        <!-- TIMELINE TAB -->
        <div *ngIf="store.activeTab() === 'timeline'" class="space-y-6">
            <app-person-tab-timeline 
                [person]="p" 
                [treeData]="store.treeData()" 
                [timeline]="store.timeline"
                [availableSources]="store.availableSources()"
                (changed)="store.markDirty(); store.savePerson()"
                (masterSaved)="store.loadAvailableSources()">
            </app-person-tab-timeline>
        </div>

        <!-- RELATIONS TAB -->
        <div *ngIf="store.activeTab() === 'relations'" class="space-y-6">
            <app-person-tab-relations 
                [person]="p" 
                [treeData]="store.treeData()" 
                [relations]="store.relations"
                (changed)="store.markDirty(); store.savePerson()">
            </app-person-tab-relations>
        </div>

        <!-- DNA TAB -->
        <div *ngIf="store.activeTab() === 'dna'" class="space-y-6">
            <app-person-tab-dna [person]="p" (changed)="store.markDirty(); store.savePerson()"></app-person-tab-dna>
        </div>

        <!-- MEDIA TAB -->
        <div *ngIf="store.activeTab() === 'media'" class="space-y-6">
            <app-person-tab-media [person]="p" [treeId]="store.treeData()?.meta?.treeId || ''"
                (changed)="store.markDirty(); store.savePerson()"></app-person-tab-media>
        </div>

        <!-- NOTES TAB -->
        <div *ngIf="store.activeTab() === 'notes'" class="space-y-6">
            <app-person-tab-notes [person]="p" (changed)="store.markDirty(); store.savePerson()"></app-person-tab-notes>
        </div>

        <!-- CITATIONS TAB -->
        <div *ngIf="store.activeTab() === 'citations'" class="space-y-6">
            <app-person-tab-citations [person]="p" [availableSources]="store.availableSources()"
                (changed)="store.markDirty(); store.savePerson()" (masterSaved)="store.loadAvailableSources()"></app-person-tab-citations>
        </div>

    </div>

    <app-modal-shell [visible]="showDeleteModal()" title="Person löschen" icon="🗑️" size="sm" [showSave]="false"
        [showDelete]="true" [deleteText]="store.isSaving() ? 'Lösche...' : 'Ja, löschen'" [loading]="store.isSaving()"
        (close)="closeDeleteModal()" (delete)="confirmDeletePerson()">
        <div class="p-4 text-neutral-600 text-center">
            <div
                class="w-16 h-16 bg-accent-danger-500/10 text-accent-danger-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"></path>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
            </div>
            <p>Möchten Sie diese Person wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.</p>
        </div>
    </app-modal-shell>
</div>
