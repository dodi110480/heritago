<app-page-header title="Alle Personen" 
    [description]="filteredIndividuals().length + ' Personen in ' + treeName()"
    [showSearch]="true"
    searchPlaceholder="Name, ID..."
    [searchTerm]="searchTerm()"
    (searchTermChange)="searchTerm.set($event)"
    [showSort]="true"
    [showSortDirection]="true"
    [sortOptions]="sortOptions"
    [sortValue]="sortMode()"
    (sortValueChange)="sortMode.set($event)"
    [sortDirection]="sortDirection()"
    (sortDirectionChange)="sortDirection.set($event)">
    <div actions class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
        <button class="btn-primary flex-shrink-0 w-full md:w-auto" (click)="createPerson()" [disabled]="isCreating">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            <span>Person anlegen</span>
        </button>
    </div>
</app-page-header>

<!-- CONTENT -->
<app-list-view 
    [isLoading]="loading()" 
    [isEmpty]="filteredIndividuals().length === 0"
    loadingText="Lade Personen-Archiv..."
    emptyIcon="👤"
    emptyTitle="Keine Personen gefunden"
    emptySubtitle="Probiere es mit einem anderen Suchbegriff oder lege eine neue Person an.">
    
    <app-entity-card *ngFor="let p of filteredIndividuals()" 
        [title]="p.name" 
        [subtitle]="getLifespan(p) | cleanDate"
        [meta]="p.id + (p.gender ? ' • ' + (p.gender === 'M' ? '♂' : (p.gender === 'F' ? '♀' : '⚧')) : '')"
        [avatarUrl]="getAvatarUrl(p)" 
        [gender]="p.gender" 
        [isFocused]="p.id === focusedPersonId()"
        [routerLink]="['/person', p.id]" 
        badgeText="Person" 
        badgeColor="primary" 
        (onClick)="rememberFocus(p.id)">

        <div actions class="flex items-center gap-2">
            <span class="text-[10px] px-2 py-1 rounded-lg font-bold border transition-colors shadow-sm" 
                [ngClass]="completionCardClass(completionFor(p).score)"
                [attr.title]="completionTooltip(p)">
                {{ completionFor(p).score }}%
            </span>
        </div>
    </app-entity-card>
</app-list-view>

<app-person-create-modal [visible]="showCreateModal()" (created)="onPersonCreated($event)"
    (closed)="showCreateModal.set(false)">
</app-person-create-modal>
