<div class="relative z-20 pb-20">
    <app-page-header [title]="'Willkommen zurück, ' + (authService.currentUser()?.username || '')"
        [description]="funStat()">
    </app-page-header>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-5 mb-10" *ngIf="!loading()">
        <app-stat-card [value]="stats()?.counts?.individuals || 0" label="Personen" icon="people" accent="brand"
            routerLink="/persons">
        </app-stat-card>
        <app-stat-card [value]="stats()?.counts?.families || 0" label="Familien" icon="family"
            accent="purple" routerLink="/families">
        </app-stat-card>
        <app-stat-card [value]="stats()?.counts?.media || 0" label="Medien" icon="media" accent="amber"
            routerLink="/media">
        </app-stat-card>
        <app-stat-card [value]="stats()?.counts?.sources || 0" label="Quellen" icon="source" accent="brand"
            routerLink="/sources">
        </app-stat-card>
        <app-stat-card [value]="stats()?.counts?.places || 0" label="Orte" icon="place" accent="emerald"
            routerLink="/places">
        </app-stat-card>
        <app-stat-card [value]="completeness() + '%'" label="Progress" icon="target" accent="emerald">
            <div class="w-full h-1 bg-slate-200 dark:bg-white/10 rounded-full mt-3 overflow-hidden">
                <div class="h-full bg-gradient-to-r from-accent-success-500 to-accent-success-600 rounded-full shadow-sm transition-all duration-1000 ease-out"
                    [style.width.%]="completeness()"></div>
            </div>
        </app-stat-card>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-[1.5fr_1fr] gap-6 mb-16">
        <a routerLink="/tree"
            class="relative no-underline text-inherit flex items-center rounded-card transition-all duration-[180ms] overflow-hidden bg-brand-500/10 dark:bg-brand-500/15 border border-brand-500/20 dark:border-brand-500/30 p-8 gap-6 group hover:bg-brand-500/15 dark:hover:bg-brand-500/20 hover:border-brand-500/30 dark:hover:border-brand-500/40 hover:-translate-y-0.5 hover:shadow-card-light">
            <div class="w-14 h-14 bg-white/80 dark:bg-white/10 rounded-lg flex items-center justify-center shrink-0 shadow-sm border border-white/40">
                <img src="/favicon.svg" alt="Tree" class="w-[50%] h-[50%] object-contain opacity-100" />
            </div>
            <div>
                <h3 class="text-2xl font-black mb-1 text-slate-900 dark:text-white tracking-tight">Stammbaum ansehen</h3>
                <p class="text-slate-700 dark:text-slate-300 text-sm leading-relaxed font-medium">Erforsche deine Ahnen in der interaktiven Ansicht</p>
            </div>
            <div
                class="text-2xl text-brand-600 ml-auto opacity-40 transition-all duration-[180ms] group-hover:translate-x-1 group-hover:opacity-100">
                →</div>
        </a>

        <div class="glass-card !p-8 flex flex-col gap-6">
            <div>
                <h3 class="text-xl font-black text-slate-900 dark:text-white mb-1">Was möchten Sie heute tun?</h3>
                <p class="text-slate-500 dark:text-slate-400 text-sm">Wählen Sie eine Aktion, um Ihren Stammbaum zu erweitern.</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button (click)="openQuickWizard('person')"
                    class="flex items-center gap-4 p-4 rounded-xl bg-white/50 dark:bg-white/5 border border-neutral-200 dark:border-white/10 hover:border-brand-500/50 hover:bg-brand-500/5 transition-all group text-left">
                    <div class="w-10 h-10 rounded-lg bg-brand-500/10 text-brand-600 flex items-center justify-center group-hover:bg-brand-500/20 transition-colors">
                        <app-icon name="plus" size="1.2rem"></app-icon>
                    </div>
                    <div>
                        <span class="block font-bold text-slate-900 dark:text-white text-sm">Neue Person</span>
                        <span class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Schritt-für-Schritt anlegen</span>
                    </div>
                </button>

                <button (click)="discoverAncestor()"
                    class="flex items-center gap-4 p-4 rounded-xl bg-white/50 dark:bg-white/5 border border-neutral-200 dark:border-white/10 hover:border-accent-highlight-500/50 hover:bg-accent-highlight-500/5 transition-all group text-left">
                    <div class="w-10 h-10 rounded-lg bg-accent-highlight-500/10 text-accent-highlight-600 flex items-center justify-center group-hover:bg-accent-highlight-500/20 transition-colors">
                        <app-icon name="target" size="1.2rem"></app-icon>
                    </div>
                    <div>
                        <span class="block font-bold text-slate-900 dark:text-white text-sm">Inspiration finden</span>
                        <span class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Zufälligen Ahnen entdecken</span>
                    </div>
                </button>

                <button (click)="toggleSwitcher()"
                    class="flex items-center gap-4 p-4 rounded-xl bg-white/50 dark:bg-white/5 border border-neutral-200 dark:border-white/10 hover:border-purple-500/50 hover:bg-purple-500/5 transition-all group text-left">
                    <div class="w-10 h-10 rounded-lg bg-purple-500/10 text-purple-600 flex items-center justify-center group-hover:bg-purple-500/20 transition-colors">
                        <app-icon name="tree" size="1.2rem"></app-icon>
                    </div>
                    <div>
                        <span class="block font-bold text-slate-900 dark:text-white text-sm">Baum wechseln</span>
                        <span class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Anderen Zweig öffnen</span>
                    </div>
                </button>

                <div
                    class="flex items-center gap-4 p-4 rounded-xl bg-white/30 dark:bg-white/5 border border-dashed border-neutral-300 dark:border-white/10 opacity-60">
                    <div class="w-10 h-10 rounded-lg bg-neutral-100 dark:bg-white/5 text-neutral-400 flex items-center justify-center">
                        <app-icon name="activity" size="1.2rem"></app-icon>
                    </div>
                    <div>
                        <span class="block font-bold text-slate-400 text-sm italic">Coming soon...</span>
                        <span class="text-[11px] text-slate-400 font-medium italic">Weitere KI-Assistenten</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div
        class="flex flex-wrap gap-2 glass-card !p-2 !rounded-xl mb-16 w-full">
        <a routerLink="/map" title="Karte"
            class="flex items-center gap-2 px-4 py-2 rounded-lg text-neutral-500 hover:text-brand-600 hover:bg-brand-500/5 transition-all duration-[180ms]">
            <app-icon name="place" size="1rem"></app-icon>
            <span class="text-xs font-bold uppercase tracking-wider">Karte</span>
        </a>
        <a routerLink="/media" title="Galerie"
            class="flex items-center gap-2 px-4 py-2 rounded-lg text-neutral-500 hover:text-brand-600 hover:bg-brand-500/5 transition-all duration-[180ms]">
            <app-icon name="media" size="1rem"></app-icon>
            <span class="text-xs font-bold uppercase tracking-wider">Galerie</span>
        </a>
        <a routerLink="/statistics" title="Statistik"
            class="flex items-center gap-2 px-4 py-2 rounded-lg text-neutral-500 hover:text-brand-600 hover:bg-brand-500/5 transition-all duration-[180ms]">
            <app-icon name="statistics" size="1rem"></app-icon>
            <span class="text-xs font-bold uppercase tracking-wider">Statistik</span>
        </a>
        <a routerLink="/activity" title="Aktivität"
            class="flex items-center gap-2 px-4 py-2 rounded-lg text-neutral-500 hover:text-brand-600 hover:bg-brand-500/5 transition-all duration-[180ms]">
            <app-icon name="activity" size="1rem"></app-icon>
            <span class="text-xs font-bold uppercase tracking-wider">Aktivität</span>
        </a>
        <a routerLink="/diagnostics" title="Fehlersuche"
            class="flex items-center gap-2 px-4 py-2 rounded-lg text-neutral-500 hover:text-brand-600 hover:bg-brand-500/5 transition-all duration-[180ms]">
            <app-icon name="diagnostics" size="1rem"></app-icon>
            <span class="text-xs font-bold uppercase tracking-wider">Prüfung</span>
        </a>
    </div>

    <div>
        <app-calendar-widget></app-calendar-widget>
    </div>
</div>

<div class="fixed inset-0 bg-ui-bg/90 backdrop-blur-md flex justify-center items-center z-modal"
    *ngIf="showTreeSwitcher()" (click)="$event.stopPropagation(); toggleSwitcher()">
    <div class="glass-card !rounded-2xl border border-neutral-200 shadow-xl max-w-lg w-full mx-4"
        (click)="$event.stopPropagation()">
        <h2 class="text-2xl font-bold text-neutral-900 mb-6">Stammbaum wählen</h2>
        <div class="flex flex-col gap-3 max-h-[400px] overflow-y-auto pr-2">
            <div *ngFor="let tree of availableTrees()"
                class="glass-card !p-4 !rounded-xl flex items-center gap-4 cursor-pointer transition-all hover:bg-brand-500/10"
                [ngClass]="{'border-brand-500 bg-brand-500/10': tree.name === treeName()}" draggable="true"
                (dragstart)="onDragStart($event, tree)" (dragend)="onDragEnd()" (click)="selectTree(tree)">
                <div
                    class="w-10 h-10 shrink-0 bg-neutral-100 rounded-xl flex items-center justify-center border border-neutral-200">
                    <img src="/favicon.svg" alt="Tree" class="w-6 h-6" />
                </div>
                <div class="flex flex-col">
                    <span class="block font-bold text-neutral-900">{{ tree.title }}</span>
                    <span class="text-[10px] uppercase font-bold tracking-widest text-neutral-400">{{ tree.name }}</span>
                </div>
            </div>
        </div>
    </div>
</div>
