<div class="modal-backdrop" *ngIf="visible" (click)="closeModal()">
    <div class="modal glass-card" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2>{{ mode === 'add' ? 'Neuen Ort anlegen' : 'Ort bearbeiten' }}</h2>
            <button class="close-btn" (click)="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="error-box" *ngIf="errorMessage()">
                {{ errorMessage() }}
            </div>

            <div class="form-group">
                <label>Beschreibung des Ortes</label>
                <input type="text" [(ngModel)]="modalData.description" class="form-control" placeholder="z.B. Krankenhaus, Haus, Rathaus, Kirche">
            </div>

            <div class="form-group" *ngIf="locationLabel()">
                <label>Automatisch erkannt</label>
                <input type="text" class="form-control" [value]="locationLabel()" readonly>
            </div>

            <div class="form-group">
                <label>Übergeordneter Ort (optional)</label>
                <select class="form-control" [(ngModel)]="modalData.parentId">
                    <option value="">Kein übergeordneter Ort</option>
                    <option *ngFor="let p of parentOptions()" [value]="p.id">{{ p.name }}</option>
                </select>
            </div>

            <div class="form-group">
                <label>Jurisdiktion (optional)</label>
                <input type="text" [(ngModel)]="modalData.jurisdiction" class="form-control" placeholder="z.B. Standesamt Coburg">
            </div>

            <div class="form-group">
                <label>Historische Namen (optional)</label>
                <input type="text" [(ngModel)]="modalData.historicNames" class="form-control" placeholder="Kommagetrennt, z.B. Kronach, Crana">
            </div>

            <div class="map-actions">
                <button class="btn btn-secondary btn-sm" (click)="useMyLocation()" type="button">Aktuelle Position verwenden</button>
                <small>Karte anklicken oder Marker ziehen.</small>
            </div>
            <div class="osm-map" #mapContainer></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" (click)="closeModal()">Abbrechen</button>
            <button class="btn btn-primary" (click)="save()"
                [disabled]="isSaving() || modalData.latitude === '' || modalData.longitude === ''">
                {{ isSaving() ? 'Speichere...' : 'Speichern' }}
            </button>
        </div>
    </div>
</div>
