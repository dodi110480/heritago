<app-modal-shell [visible]="visible" [title]="mode === 'add' ? 'Neuen Ort anlegen' : 'Ort bearbeiten'" icon="📍"
    size="lg" [loading]="isSaving()" [disabledSave]="modalData.latitude === '' || modalData.longitude === ''"
    (close)="closeModal()" (save)="save()">

    <div class="flex flex-col gap-5">
        <div class="bg-state-errorBg/10 border border-state-errorBg/20 text-state-error p-4 rounded-xl text-sm" *ngIf="errorMessage()">
            {{ errorMessage() }}
        </div>

        <div class="space-y-1.5">
            <label class="block text-sm font-medium text-neutral-400">Beschreibung des Ortes</label>
            <input type="text" [(ngModel)]="modalData.description" class="form-input"
                placeholder="z.B. Krankenhaus, Haus, Rathaus, Kirche">
        </div>

        <div class="space-y-1.5" *ngIf="locationLabel()">
            <label class="block text-sm font-medium text-neutral-400">Automatisch erkannt</label>
            <input type="text" class="form-input opacity-80" [value]="locationLabel()" readonly>
        </div>

        <div class="space-y-1.5">
            <label class="block text-sm font-medium text-neutral-400">Übergeordneter Ort (optional)</label>
            <select class="form-input" [(ngModel)]="modalData.parentId">
                <option value="">Kein übergeordneter Ort</option>
                <option *ngFor="let p of parentOptions()" [value]="p.id">{{ p.name }}</option>
            </select>
        </div>

        <div class="space-y-1.5">
            <label class="block text-sm font-medium text-neutral-400">Jurisdiktion (optional)</label>
            <input type="text" [(ngModel)]="modalData.jurisdiction" class="form-input"
                placeholder="z.B. Standesamt Coburg">
        </div>

        <div class="space-y-1.5">
            <label class="block text-sm font-medium text-neutral-400">Historische Namen (optional)</label>
            <input type="text" [(ngModel)]="modalData.historicNames" class="form-input"
                placeholder="Kommagetrennt, z.B. Kronach, Crana">
        </div>

        <div class="flex justify-between items-center gap-3 mt-2">
            <button class="btn-secondary !w-auto !py-1.5 !px-3 !text-sm" (click)="useMyLocation()"
                type="button">Aktuelle Position verwenden</button>
            <small class="text-neutral-400 text-xs text-right pr-2">Karte anklicken oder Marker ziehen.</small>
        </div>

        <div class="w-full h-[350px] md:h-[400px] rounded-xl overflow-hidden border border-canvas-white/10" #mapContainer>
        </div>
    </div>
</app-modal-shell>
