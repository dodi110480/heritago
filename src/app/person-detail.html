<div *ngIf="person() as p" (input)="markDirty()">
    <app-page-header [title]="p.firstName + ' ' + p.lastName"
        [description]="(p.birthDate | cleanDate) + ' - ' + (p.deathDate | cleanDate)">
        <div breadcrumbs>
            <button class="btn-ghost !w-auto !px-3" (click)="goBack()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Zurück
            </button>
        </div>

        <div actions></div>
    </app-page-header>

    <div
        class="flex gap-2 overflow-x-auto pb-4 mb-6 border-b border-canvas/5 no-scrollbar animate-in slide-in-from-top-4 duration-[180ms]">
        <button *ngFor="let tab of [
            {id: 'basics', label: 'Allgemeines'},
            {id: 'timeline', label: 'Lebenslauf'},
            {id: 'relations', label: 'Familie'},
            {id: 'names', label: 'Namen'},
            {id: 'associations', label: 'Assoziationen'},
            {id: 'dna', label: 'DNA'},
            {id: 'media', label: 'Medien'},
            {id: 'notes', label: 'Notizen'},
            {id: 'citations', label: 'Referenzen'}
        ]" (click)="activeTab = tab.id"
            [class]="activeTab === tab.id ? 
            'px-4 py-2 rounded-lg bg-brand-500/10 text-brand-600 border border-brand-500/20 text-sm font-semibold whitespace-nowrap shadow-sm' : 
            'px-4 py-2 rounded-lg hover:bg-canvas/5 text-neutral-500 hover:text-neutral-900 text-sm font-medium transition-all duration-[180ms] whitespace-nowrap'">
            {{tab.label}}
        </button>
    </div>

    <div class="space-y-8 animate-in fade-in duration-500 pb-20">

        <!-- Tab: Basics -->
        <div *ngIf="activeTab === 'basics'" class="space-y-6">
            <app-person-expert-basics-tab [person]="p" (changed)="markDirty(); savePerson()"
                (deleteRequested)="openDeleteModal()"></app-person-expert-basics-tab>
        </div>

        <!-- TIMELINE TAB -->
        <div *ngIf="activeTab === 'timeline'" class="space-y-6">
            <app-person-expert-timeline-tab [ctx]="self"></app-person-expert-timeline-tab>
        </div>

        <!-- RELATIONS TAB -->
        <div *ngIf="activeTab === 'relations'" class="space-y-6">
            <app-person-expert-relations-tab [ctx]="self"></app-person-expert-relations-tab>
        </div>

        <!-- NAMES TAB -->
        <div *ngIf="activeTab === 'names'" class="space-y-6">
            <app-person-tab-names [person]="p" (changed)="markDirty(); savePerson()"></app-person-tab-names>
        </div>

        <!-- ASSOCIATIONS TAB -->
        <div *ngIf="activeTab === 'associations'" class="space-y-6">
            <app-person-tab-associations [person]="p" [allPersonsOptions]="allPersonsOptions()"
                (changed)="markDirty(); savePerson()"></app-person-tab-associations>
        </div>

        <!-- DNA TAB -->
        <div *ngIf="activeTab === 'dna'" class="space-y-6">
            <app-person-tab-dna [person]="p" (changed)="markDirty(); savePerson()"></app-person-tab-dna>
        </div>

        <!-- MEDIA TAB -->
        <div *ngIf="activeTab === 'media'" class="space-y-6">
            <app-person-tab-media [person]="p" [treeId]="treeData()?.meta?.treeId || ''"
                (changed)="markDirty(); savePerson()"></app-person-tab-media>
        </div>

        <!-- NOTES TAB -->
        <div *ngIf="activeTab === 'notes'" class="space-y-6">
            <app-person-tab-notes [person]="p" (changed)="markDirty(); savePerson()"></app-person-tab-notes>
        </div>

        <!-- CITATIONS TAB -->
        <div *ngIf="activeTab === 'citations'" class="space-y-6">
            <app-person-tab-citations [person]="p" [availableSources]="availableSources()"
                (changed)="markDirty(); savePerson()"></app-person-tab-citations>
        </div>

    </div>

    <!-- PLACE MODAL (global – used by timeline tab) -->
    <app-place-modal [visible]="showPlaceModal" [mode]="placeModalMode" [initialData]="selectedPlaceForModal"
        (saved)="onPlaceModalSaved($event)" (closed)="showPlaceModal = false">
    </app-place-modal>

    <app-person-create-modal [visible]="showRelationModal()"
        [title]="(relationModalType === 'child' ? 'Kind' : relationModalType === 'partner' ? 'Partner/in' : relationModalType === 'father' ? 'Vater' : 'Mutter') + ' hinzufügen'"
        [initialLastName]="newPersonData().lastName" (created)="onPersonCreated($event)"
        (closed)="closeRelationModal()">
    </app-person-create-modal>

    <app-modal-shell [visible]="showDeleteModal()" title="Person löschen" icon="🗑️" size="sm" [showSave]="false"
        [showDelete]="true" [deleteText]="isDeleting ? 'Lösche...' : 'Ja, löschen'" [loading]="isDeleting"
        (close)="closeDeleteModal()" (delete)="confirmDeletePerson()">
        <div class="p-4 text-neutral-600 text-center">
            <div
                class="w-16 h-16 bg-accent-danger-500/10 text-accent-danger-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"></path>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
            </div>
            <p>Möchten Sie diese Person wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.</p>
        </div>
    </app-modal-shell>

    <!-- RELATION CREATE MODAL (global – used by relations tab via ctx) -->
    <app-modal-shell [visible]="showRelationCreateModal()" title="Beziehung hinzufügen" icon="👨‍👩‍👧‍👦" size="md"
        [showSave]="true" saveText="Beziehung hinzufügen" [showDelete]="false" (close)="closeRelationCreateModal()"
        (save)="confirmAddRelation()">
        <div class="space-y-4">
            <div class="form-group mb-0">
                <label class="form-label">Beziehungstyp</label>
                <select [ngModel]="newRelationDraft().type"
                    (ngModelChange)="newRelationDraft.update(v => ({ ...v, type: $event }))" class="form-input !py-2.5">
                    <option value="SPOUSE">Partner/in</option>
                    <option value="FATHER">Vater</option>
                    <option value="MOTHER">Mutter</option>
                    <option value="CHILD">Kind</option>
                </select>
            </div>
            <div class="form-group mb-0">
                <label class="form-label">Person</label>
                <input type="text" [ngModel]="newRelationDraft().personInput"
                    (ngModelChange)="newRelationDraft.update(v => ({ ...v, personInput: $event }))"
                    list="relation-person-list" class="form-input" placeholder="Person auswählen...">
                <datalist id="relation-person-list">
                    <option *ngFor="let opt of allPersonsOptions()" [value]="opt.displayName"></option>
                </datalist>
            </div>
        </div>
    </app-modal-shell>

    <!-- TIMELINE MODALS (global – used by timeline tab via ctx) -->
    <app-modal-shell [visible]="showTimelineCreateModal()" title="Ereignis/Fakt hinzufügen" icon="📌" size="md"
        [showSave]="true" saveText="Hinzufügen" [showDelete]="false" (close)="closeTimelineCreateModal()"
        (save)="confirmAddTimelineItem()">
        <div class="space-y-4">
            <div class="form-group mb-0">
                <label class="form-label">Typ</label>
                <select [ngModel]="newTimelineDraft().itemKind"
                    (ngModelChange)="newTimelineDraft.update(v => ({ ...v, itemKind: $event, tag: $event === 'fact' ? 'FACT' : 'DEAT' }))"
                    class="form-input !py-2.5">
                    <option value="event">Ereignis</option>
                    <option value="fact">Fakt</option>
                </select>
            </div>

            <div class="form-group mb-0">
                <label class="form-label">Kategorie</label>
                <select [ngModel]="newTimelineDraft().tag"
                    (ngModelChange)="newTimelineDraft.update(v => ({ ...v, tag: $event }))" class="form-input !py-2.5">
                    <ng-container *ngIf="newTimelineDraft().itemKind === 'event'; else factTags">
                        <option value="BIRT">Geburt</option>
                        <option value="CHR">Taufe</option>
                        <option value="DEAT">Tod</option>
                        <option value="BURI">Begräbnis</option>
                        <option value="CREM">Einäscherung</option>
                        <option value="EMIG">Auswanderung</option>
                        <option value="IMMI">Einwanderung</option>
                        <option value="MARR">Heirat</option>
                    </ng-container>
                    <ng-template #factTags>
                        <option value="OCCU">Beruf</option>
                        <option value="RELI">Religion</option>
                        <option value="EDUC">Bildung</option>
                        <option value="RESI">Wohnsitz</option>
                        <option value="TITL">Titel</option>
                        <option value="NATI">Nationalität/Herkunft</option>
                        <option value="DSCR">Körperl. Merkmale</option>
                        <option value="FACT">Anderer Fakt</option>
                    </ng-template>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-group mb-0">
                    <label class="form-label">Datum</label>
                    <input type="text" [ngModel]="newTimelineDraft().date"
                        (ngModelChange)="newTimelineDraft.update(v => ({ ...v, date: $event }))" class="form-input"
                        placeholder="z.B. 12 MAR 1890">
                </div>
                <div class="form-group mb-0">
                    <label class="form-label">Ort</label>
                    <input type="text" [ngModel]="newTimelineDraft().place"
                        (ngModelChange)="newTimelineDraft.update(v => ({ ...v, place: $event }))" class="form-input"
                        placeholder="z.B. München">
                </div>
            </div>

            <div class="form-group mb-0">
                <label class="form-label">{{ newTimelineDraft().itemKind === 'fact' ? 'Wert' : 'Beschreibung' }}</label>
                <input type="text" [ngModel]="newTimelineDraft().description"
                    (ngModelChange)="newTimelineDraft.update(v => ({ ...v, description: $event }))" class="form-input"
                    placeholder="Optional">
            </div>
        </div>
    </app-modal-shell>

    <app-modal-shell [visible]="showTimelineItemModal()"
        [title]="activeTimelineItem() ? (getTagLabel(activeTimelineItem()!.tag) + ' bearbeiten') : 'Ereignis bearbeiten'"
        icon="📅" size="md" [showSave]="true" saveText="Speichern"
        [showDelete]="!!activeTimelineItem() && !isTimelineItemLocked(activeTimelineItem()!)" deleteText="Löschen"
        (close)="closeTimelineItemModal()" (save)="saveTimelineItemModal()" (delete)="removeTimelineItemModal()">
        <div *ngIf="activeTimelineItem() as item" class="space-y-4">
            <div *ngIf="isTimelineItemLocked(item)"
                class="text-[11px] text-neutral-500 bg-canvas/5 border border-neutral-200 rounded-xl px-3 py-2 flex items-center justify-between gap-3">
                <span>Dieses Ereignis ist abgeleitet/familienbasiert und hier nur lesbar.</span>
                <button *ngIf="hasTimelineItemSource(item)" (click)="goToTimelineItemSource(item)"
                    class="badge-neutral !py-1 !px-2">
                    {{ getTimelineItemSourceLabel(item) }}
                </button>
            </div>

            <div class="form-group mb-0">
                <label class="form-label">Kategorie</label>
                <select [(ngModel)]="item.tag" (ngModelChange)="markDirty()" [disabled]="isTimelineItemLocked(item)"
                    class="form-input !py-2.5 disabled:opacity-60 disabled:cursor-not-allowed">
                    <optgroup label="Lebensereignisse">
                        <option value="BIRT">Geburt</option>
                        <option value="CHR">Taufe</option>
                        <option value="DEAT">Tod</option>
                        <option value="BURI">Begräbnis</option>
                        <option value="CREM">Einäscherung</option>
                        <option value="EMIG">Auswanderung</option>
                        <option value="IMMI">Einwanderung</option>
                        <option value="MARR">Heirat</option>
                    </optgroup>
                    <optgroup label="Eigenschaften &amp; Fakten">
                        <option value="OCCU">Beruf</option>
                        <option value="RELI">Religion</option>
                        <option value="EDUC">Bildung</option>
                        <option value="RESI">Wohnsitz</option>
                        <option value="TITL">Titel</option>
                        <option value="NATI">Nationalität/Herkunft</option>
                        <option value="DSCR">Körperl. Merkmale</option>
                        <option value="FACT">Anderer Fakt</option>
                    </optgroup>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-group mb-0">
                    <label class="form-label">Datum</label>
                    <input type="text" [(ngModel)]="item.date" (ngModelChange)="markDirty()"
                        [disabled]="isTimelineItemLocked(item)"
                        class="form-input disabled:opacity-60 disabled:cursor-not-allowed"
                        placeholder="z.B. 12 MAR 1890">
                </div>
                <div class="form-group mb-0">
                    <label class="form-label">Ort</label>
                    <input type="text" [(ngModel)]="item.place" (ngModelChange)="markDirty()"
                        [disabled]="isTimelineItemLocked(item)"
                        class="form-input disabled:opacity-60 disabled:cursor-not-allowed" placeholder="z.B. München">
                </div>
            </div>

            <div class="form-group mb-0">
                <label class="form-label">Beschreibung / Wert</label>
                <input *ngIf="['OCCU', 'EDUC', 'RELI', 'RESI', 'TITL', 'NATI', 'DSCR', 'FACT'].includes(item.tag)"
                    type="text" [(ngModel)]="item.value" (ngModelChange)="markDirty()"
                    [disabled]="isTimelineItemLocked(item)"
                    class="form-input disabled:opacity-60 disabled:cursor-not-allowed" placeholder="Optional">
                <input *ngIf="!['OCCU', 'EDUC', 'RELI', 'RESI', 'TITL', 'NATI', 'DSCR', 'FACT'].includes(item.tag)"
                    type="text" [(ngModel)]="item.description" (ngModelChange)="markDirty()"
                    [disabled]="isTimelineItemLocked(item)"
                    class="form-input disabled:opacity-60 disabled:cursor-not-allowed" placeholder="Optional">
            </div>
        </div>
    </app-modal-shell>

</div>
