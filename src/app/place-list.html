<div class="places-container">
    <div class="glass-card wide-card">
        <div class="header">
            <div class="title-group">
                <h1>Orte verwalten</h1>
                <p>Übersicht aller Orte in deiner Familiendatenbank</p>
            </div>
            <button class="btn-primary" (click)="openAddModal()">
                <span>+ Neuer Ort</span>
            </button>
        </div>

        <div *ngIf="loading()" class="status-msg">
            <div class="spinner"></div>
            <span>Lade Orte...</span>
        </div>

        <div *ngIf="!loading() && places().length === 0" class="status-msg">
            <p>Keine Orte gefunden.</p>
        </div>

        <div class="table-container" *ngIf="!loading() && places().length > 0">
            <table class="places-table">
                <thead>
                    <tr>
                        <th>Ortsname</th>
                        <th>
                            Koordinaten
                            <span class="info-hint" title="Nur Orte mit Koordinaten erscheinen auf der Karte">ℹ️</span>
                        </th>
                        <th class="actions-head">Aktionen</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let place of places()">
                        <td>
                            <div class="place-name-cell">
                                <span class="marker">📍</span>
                                <div>
                                    <span class="full-name">{{ place.name }}</span>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="coords-cell" *ngIf="place.latitude">
                                <span class="lat">{{ place.latitude }}</span>
                                <span class="lng">{{ place.longitude }}</span>
                            </div>
                            <span class="no-coords" *ngIf="!place.latitude">Keine Koordinaten</span>
                        </td>
                        <td class="actions-cell">
                            <button class="btn-icon edit" (click)="openEditModal(place)" title="Bearbeiten">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                </svg>
                            </button>
                            <button class="btn-icon delete" (click)="deletePlace(place.name)" title="Löschen">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path
                                        d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                    </path>
                                </svg>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <app-place-modal [visible]="isModalOpen" [mode]="modalMode" [initialData]="selectedPlaceData"
        (saved)="onPlaceSaved()" (closed)="closeModal()">
    </app-place-modal>
</div>
