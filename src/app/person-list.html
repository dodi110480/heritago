<app-page-container [wide]="true">
    <app-page-header title="Alle Personen" [description]="filteredIndividuals().length + ' Personen in ' + treeName()">

        <div actions class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
            <!-- Suche -->
            <div class="search-wrapper">
                <div class="search-icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <input type="text" placeholder="Suchen nach Name, ID..." [ngModel]="searchTerm()"
                    (ngModelChange)="searchTerm.set($event)" class="search-input">
            </div>

            <!-- Sortierung -->
            <div class="flex items-center gap-2 text-neutral-950 text-sm justify-between w-full md:w-auto">
                <label for="sortMode" class="whitespace-nowrap">Sortieren</label>
                <div class="flex items-center gap-2 flex-1 md:flex-none">
                    <select id="sortMode"
                        class="glass-card !px-3 !py-2.5 !rounded-xl text-neutral-900 min-w-[180px] w-full md:w-auto outline-none focus:ring-2 focus:ring-brand-500/30"
                        [ngModel]="sortMode()" (ngModelChange)="sortMode.set($event)">
                        <option value="completion_desc" class="bg-neutral-100 text-neutral-900">Vollständigkeit</option>
                        <option value="first_asc" class="bg-neutral-100 text-neutral-900">Vorname (A-Z)</option>
                        <option value="last_asc" class="bg-neutral-100 text-neutral-900">Nachname (A-Z)</option>
                        <option value="family_desc" class="bg-neutral-100 text-neutral-900">Familienbezug</option>
                    </select>
                    <button
                        class="w-10 h-10 flex items-center justify-center glass-card !rounded-xl text-neutral-950 hover:bg-neutral-100 hover:text-neutral-900 transition-colors cursor-pointer shrink-0"
                        (click)="toggleSortDirection()"
                        [attr.title]="sortDirection() === 'asc' ? 'Aufsteigend' : 'Absteigend'">
                        <svg *ngIf="sortDirection() === 'asc'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="18 15 12 9 6 15"></polyline>
                        </svg>
                        <svg *ngIf="sortDirection() === 'desc'" xmlns="http://www.w3.org/2000/svg" width="16"
                            height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                </div>
            </div>

            <button class="btn-primary flex-shrink-0 w-full md:w-auto" (click)="createPerson()" [disabled]="isCreating">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
                <span>Person anlegen</span>
            </button>
        </div>
    </app-page-header>

    <!-- CONTENT -->
    <div class="relative w-full overflow-y-visible pb-10">
        <div *ngIf="loading()" class="py-20 flex flex-col items-center justify-center gap-4 text-brand-400">
            <div
                class="w-12 h-12 border-4 border-brand-500/20 border-t-brand-500 rounded-full animate-spin shadow-brand-glow">
            </div>
            <p class="font-bold tracking-widest uppercase text-xs animate-pulse">Lade Personen-Archiv...</p>
        </div>

        <div *ngIf="!loading()"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 animate-in fade-in slide-in-from-bottom-4 duration-700">
            <ng-container *ngFor="let p of filteredIndividuals()">
                <app-entity-card [title]="p.name" [subtitle]="getLifespan(p) | cleanDate"
                    [avatarUrl]="getProfileImage(p)" [isFocused]="p.id === focusedPersonId()"
                    [routerLink]="['/person', p.id]" badgeText="Person" badgeColor="primary" (click)="rememberFocus(p.id)">

                    <div badges class="flex flex-wrap gap-2">
                        <span class="badge badge-neutral" [ngClass]="completionColorClass(completionFor(p).score)"
                            [attr.title]="completionTooltip(p)">
                            <span class="w-1.5 h-1.5 rounded-full" [ngClass]="completionDotClass(completionFor(p).score)"></span>
                            {{ completionFor(p).score }}%
                        </span>
                    </div>

                    <div footer
                        class="flex items-center justify-between text-[10px] text-neutral-950 uppercase tracking-widest font-bold">
                        <span>{{ p.id }}</span>
                        <span *ngIf="p.gender" class="opacity-50 text-xs">
                            {{ p.gender === 'M' ? '♂' : (p.gender === 'F' ? '♀' : '⚧') }}
                        </span>
                    </div>
                </app-entity-card>
            </ng-container>
        </div>

        <!-- Leer-Zustand -->
        <div *ngIf="!loading() && filteredIndividuals().length === 0"
            class="py-32 flex flex-col items-center justify-center text-neutral-950 glass-card">
            <div class="w-20 h-20 bg-brand-100 rounded-full flex items-center justify-center mb-6 text-4xl opacity-50">👤
            </div>
            <h3 class="text-xl font-bold text-neutral-900 mb-2">Keine Personen gefunden</h3>
            <p class="text-neutral-950">Probiere es mit einem anderen Suchbegriff oder lege eine neue Person an.</p>
        </div>
    </div>
</app-page-container>

<app-person-create-modal [visible]="showCreateModal()" (created)="onPersonCreated($event)"
    (closed)="showCreateModal.set(false)">
</app-person-create-modal>
