<div class="relative w-full h-screen overflow-hidden flex flex-col -mx-4 md:-mx-8">
    <!-- MAP CONTAINER -->
    <div class="absolute inset-0 z-0" #mapContainer></div>

    <!-- STANDARDIZED FLOATING HEADER -->
    <!-- md:left-4 + md:px-4 inside glass-card = 16px + 16px = 32px (matches standard 32px breadcrumb offset) -->
    <div class="absolute top-6 left-0 md:left-4 right-0 md:right-4 pointer-events-none z-10">
        <div class="pointer-events-auto glass-card shadow-2xl !p-3 md:!px-4 md:!py-3 max-w-5xl animate-in slide-in-from-top-10 duration-700">
            <app-page-header title="Interaktive Weltkarte" description="Orte deiner Familiengeschichte" [flat]="true">
                <div actions class="flex items-center gap-2">
                    <button class="btn-secondary !w-auto !py-1.5 !px-3 text-xs md:text-sm" (click)="toggleMapTheme()">
                        {{ mapTheme() === 'dark' ? 'Helle Karte' : 'Dunkle Karte' }}
                    </button>
                    <div class="badge badge-primary !py-1.5 !px-3 !rounded-xl" *ngIf="!loading()">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-black">{{ visibleCount() }}</span>
                            <span class="text-[9px] font-black uppercase tracking-widest opacity-70">Gefundene Orte</span>
                        </div>
                    </div>
                </div>
            </app-page-header>
        </div>
    </div>

    <!-- STATUS OVERLAYS -->
    <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-20">
        <!-- LOADING -->
        <div *ngIf="loading()" class="pointer-events-auto">
            <div class="glass-card shadow-xl flex flex-col gap-6 group hover:border-brand-500/20 transition-all duration-300">
                <div class="w-16 h-16 border-4 border-neutral-300/40 border-l-brand-500 rounded-full animate-spin shadow-brand-glow mx-auto"></div>
                <span class="text-sm font-black text-neutral-900 uppercase tracking-[0.2em]">Karte wird geladen...</span>
            </div>
        </div>

        <!-- NO DATA -->
        <div *ngIf="!loading() && markers().length === 0" class="pointer-events-auto">
            <div class="glass-card !p-12 shadow-2xl flex flex-col items-center text-center max-w-sm animate-in zoom-in-95 duration-500">
                <div class="w-20 h-20 bg-surface rounded-[32px] flex items-center justify-center text-4xl mb-6 shadow-xl border border-canvas-white/5">
                    🗺️
                </div>
                <h3 class="text-2xl font-black text-canvas-white tracking-tight mb-4">Keine Orte gefunden</h3>
                <p class="text-neutral-400 text-sm leading-relaxed mb-8">In deiner Datenbank sind noch keine Orte mit geografischen Koordinaten hinterlegt.</p>
                <button class="btn-primary w-full py-4 text-lg" routerLink="/">Zurück zum Dashboard</button>
            </div>
        </div>
    </div>
</div>
