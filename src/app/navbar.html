<nav class="navbar" *ngIf="authService.isAuthenticated()">
    <div class="navbar-container">
        <!-- Logo / Back to Dashboard -->
        <a routerLink="/" class="navbar-brand">
            <img src="/favicon.svg" alt="Heritago Logo" class="brand-logo" />
            <span>Heritago</span>
        </a>

        <div class="navbar-links">
            <a routerLink="/tree" routerLinkActive="active">Stammbaum</a>
            <a routerLink="/persons" routerLinkActive="active">Personen</a>
            <a routerLink="/media" routerLinkActive="active">Medien</a>
            <a routerLink="/places" routerLinkActive="active">Orte</a>
        </div>

        <!-- Search Bar -->
        <div class="navbar-search">
            <input type="text" placeholder="Suchen..." (keyup.enter)="search($event)" />
        </div>

        <!-- User / Logout / Settings -->
        <div class="navbar-user">
            <!-- Diagnostics Notification -->
            <a routerLink="/diagnostics" class="notification-btn" title="Fehlerdiagnose" *ngIf="errorCount() > 0">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="notification-badge">{{ errorCount() }}</span>
            </a>

            <span class="user-name">{{ authService.currentUser()?.username }}</span>
            <a routerLink="/settings" class="settings-btn" title="Einstellungen">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
            </a>
            <button (click)="logout()" class="logout-btn" title="Ausloggen">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </button>
        </div>
    </div>
</nav>
