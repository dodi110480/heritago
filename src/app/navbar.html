<nav class="fixed top-0 w-full h-14 md:h-16 z-navbar bg-ui-surfaceDark/50 backdrop-blur-xl border-b border-canvas-white/10 shadow-lg"
    *ngIf="authService.isAuthenticated()">
    <div class="max-w-[1400px] mx-auto px-4 h-full flex items-center justify-between">
        <!-- Logo / Back to Dashboard -->
        <a routerLink="/"
            class="flex items-center gap-2 text-canvas-white font-bold text-lg md:text-base hover:text-brand-400 py-2">
            <img src="/favicon.svg" alt="Heritago Logo" class="w-7 h-7 md:w-6 md:h-6 object-contain" />
            <span class="hidden md:block">Heritago</span>
        </a>

        <!-- Desktop & Mobile Links -->
        <div class="hidden md:flex items-center gap-2"
            [ngClass]="{'!flex flex-col absolute top-full left-0 w-full bg-ui-surfaceDark p-4 border-b border-canvas-white/10 shadow-2xl items-start h-screen overflow-y-auto z-50': isMobileMenuOpen()}">
            <a routerLink="/tree" routerLinkActive="!bg-brand-500/15 !text-brand-400 !border-brand-500/30"
                class="flex items-center gap-3 px-4 py-3 md:py-2 w-full md:w-auto md:px-4 rounded-xl text-neutral-400 hover:bg-brand-500/10 hover:text-brand-400 hover:-translate-y-0.5 border border-transparent hover:border-brand-500/20 transition-all font-semibold text-lg md:text-sm"
                (click)="closeMobileMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px] md:w-4 md:h-4" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="5" r="3"></circle>
                    <line x1="12" y1="22" x2="12" y2="8"></line>
                    <path d="M5 12H2a10 10 0 0 0 20 0h-3"></path>
                </svg>
                <span>Stammbaum</span>
            </a>
            <a routerLink="/persons" routerLinkActive="!bg-brand-500/15 !text-brand-400 !border-brand-500/30"
                class="flex items-center gap-3 px-4 py-3 md:py-2 w-full md:w-auto md:px-4 rounded-xl text-neutral-400 hover:bg-brand-500/10 hover:text-brand-400 hover:-translate-y-0.5 border border-transparent hover:border-brand-500/20 transition-all font-semibold text-lg md:text-sm"
                (click)="closeMobileMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px] md:w-4 md:h-4" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>Personen</span>
            </a>
            <a routerLink="/families" routerLinkActive="!bg-brand-500/15 !text-brand-400 !border-brand-500/30"
                class="flex items-center gap-3 px-4 py-3 md:py-2 w-full md:w-auto md:px-4 rounded-xl text-neutral-400 hover:bg-brand-500/10 hover:text-brand-400 hover:-translate-y-0.5 border border-transparent hover:border-brand-500/20 transition-all font-semibold text-lg md:text-sm"
                (click)="closeMobileMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px] md:w-4 md:h-4" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.84-8.84 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                    </path>
                </svg>
                <span>Familien</span>
            </a>
            <a routerLink="/media" routerLinkActive="!bg-brand-500/15 !text-brand-400 !border-brand-500/30"
                class="flex items-center gap-3 px-4 py-3 md:py-2 w-full md:w-auto md:px-4 rounded-xl text-neutral-400 hover:bg-brand-500/10 hover:text-brand-400 hover:-translate-y-0.5 border border-transparent hover:border-brand-500/20 transition-all font-semibold text-lg md:text-sm"
                (click)="closeMobileMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px] md:w-4 md:h-4" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <span>Medien</span>
            </a>
            <a routerLink="/places" routerLinkActive="!bg-brand-500/15 !text-brand-400 !border-brand-500/30"
                class="flex items-center gap-3 px-4 py-3 md:py-2 w-full md:w-auto md:px-4 rounded-xl text-neutral-400 hover:bg-brand-500/10 hover:text-brand-400 hover:-translate-y-0.5 border border-transparent hover:border-brand-500/20 transition-all font-semibold text-lg md:text-sm"
                (click)="closeMobileMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px] md:w-4 md:h-4" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                </svg>
                <span>Orte</span>
            </a>
            <a routerLink="/sources" routerLinkActive="!bg-brand-500/15 !text-brand-400 !border-brand-500/30"
                class="flex items-center gap-3 px-4 py-3 md:py-2 w-full md:w-auto md:px-4 rounded-xl text-neutral-400 hover:bg-brand-500/10 hover:text-brand-400 hover:-translate-y-0.5 border border-transparent hover:border-brand-500/20 transition-all font-semibold text-lg md:text-sm"
                (click)="closeMobileMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px] md:w-4 md:h-4" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <span>Quellen</span>
            </a>
        </div>

        <!-- User / Logout / Settings -->
        <div class="flex items-center gap-2 md:gap-4 md:ml-auto">
            <!-- Diagnostics Notification -->
            <a routerLink="/diagnostics"
                class="relative text-accent-danger-400 hover:text-accent-danger-300 p-2 hover:bg-accent-danger-500/10 rounded-full transition-colors"
                title="Fehlerdiagnose" *ngIf="errorCount() > 0">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span
                    class="absolute top-0 right-0 bg-accent-danger-500 text-canvas-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full font-bold shadow-lg ring-2 ring-surface-dark">
                    {{ errorCount() }}
                </span>
            </a>

            <span class="hidden md:block text-neutral-400 font-medium text-sm">{{ authService.currentUser()?.username
                }}</span>
            <a routerLink="/settings"
                class="text-neutral-400 hover:text-brand-400 p-2 hover:bg-brand-500/10 rounded-full transition-colors"
                title="Einstellungen">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
            </a>
            <button (click)="logout()"
                class="text-neutral-400 hover:text-accent-danger-400 p-2 hover:bg-accent-danger-500/10 rounded-full transition-colors"
                title="Ausloggen">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </button>
            <button class="md:hidden text-neutral-400 p-2" (click)="toggleMobileMenu()" title="Menü">
                <svg *ngIf="!isMobileMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                <svg *ngIf="isMobileMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>
</nav>
