<app-page-header title="Einstellungen" description="Konfiguriere deine Heritago-Umgebung"></app-page-header>

<div class="flex-1 p-0 max-w-[1200px] w-full mx-auto pb-20">
    <div
        class="bg-brand-900/40 backdrop-blur-md border border-canvas-white/5 rounded-[32px] p-8 md:p-12 shadow-2xl relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-96 h-96 bg-brand-600/10 blur-[100px] rounded-full"></div>
        <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-accent-highlight-600/10 blur-[100px] rounded-full"></div>

        <div class="relative z-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <a routerLink="/tree-management"
                    class="group p-6 rounded-2xl bg-canvas-white/5 border border-canvas-white/10 hover:border-brand-500/50 hover:bg-brand-500/5 transition-all duration-300">
                    <div
                        class="w-12 h-12 rounded-xl bg-brand-500/10 flex items-center justify-center text-brand-400 mb-4 group-hover:scale-110 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M12 20v-8"></path>
                            <path d="M5 20v-2a7 7 0 0 1 14 0v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <h3 class="text-lg font-bold text-neutral-100 mb-1">Stammbaumverwaltung</h3>
                    <p class="text-sm text-neutral-400">Erstellen, wechseln oder bearbeiten</p>
                </a>

                <a *ngIf="authService.currentUser()?.isAdmin" routerLink="/admin/users"
                    class="group p-6 rounded-2xl bg-canvas-white/5 border border-canvas-white/10 hover:border-accent-highlight-500/50 hover:bg-accent-highlight-500/5 transition-all duration-300">
                    <div
                        class="w-12 h-12 rounded-xl bg-accent-highlight-500/10 flex items-center justify-center text-accent-highlight-400 mb-4 group-hover:scale-110 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <h3 class="text-lg font-bold text-neutral-100 mb-1">Benutzerverwaltung</h3>
                    <p class="text-sm text-neutral-400">Nutzer hinzufügen oder Berechtigungen anpassen</p>
                </a>

                <a *ngIf="authService.currentUser()?.isAdmin" routerLink="/gedcom-io"
                    class="group p-6 rounded-2xl bg-canvas-white/5 border border-canvas-white/10 hover:border-accent-success-500/50 hover:bg-accent-success-500/5 transition-all duration-300">
                    <div
                        class="w-12 h-12 rounded-xl bg-accent-success-500/10 flex items-center justify-center text-accent-success-400 mb-4 group-hover:scale-110 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <h3 class="text-lg font-bold text-neutral-100 mb-1">GEDCOM Import/Export</h3>
                    <p class="text-sm text-neutral-400">Datensicherung und Datenaustausch</p>
                </a>

                <a *ngIf="authService.currentUser()?.isAdmin" routerLink="/settings/update"
                    class="group p-6 rounded-2xl bg-canvas-white/5 border border-canvas-white/10 hover:border-accent-highlight-500/50 hover:bg-accent-highlight-500/5 transition-all duration-300">
                    <div
                        class="w-12 h-12 rounded-xl bg-accent-highlight-500/10 flex items-center justify-center text-accent-highlight-400 mb-4 group-hover:scale-110 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M21 2v6h-6"></path>
                            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                            <path d="M3 22v-6h6"></path>
                            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                        </svg>
                    </div>
                    <h3 class="text-lg font-bold text-neutral-100 mb-1">Update & System</h3>
                    <p class="text-sm text-neutral-400">Version prüfen und System aktualisieren</p>
                </a>
            </div>

            <div class="mt-12 pt-8 border-t border-canvas-white/5 flex justify-center">
                <a routerLink="/" class="btn-ghost !w-auto !py-4 !px-8 flex items-center gap-3">
                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Zurück zum Dashboard</span>
                </a>
            </div>
        </div>
    </div>
</div>
