<div class="settings-container">
    <div class="glass-card">
        <div class="header">
            <h1>Einstellungen</h1>
            <p>Konfiguriere deine Heritago-Umgebung</p>
        </div>

        <div class="actions-grid">
            <a *ngIf="authService.currentUser()?.isAdmin" routerLink="/create-tree" class="action-card">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="16" />
                        <line x1="8" y1="12" x2="16" y2="12" />
                    </svg>
                </div>
                <h3>Stammbaum erstellen</h3>
                <p>Beginne eine neue Familiengeschichte</p>
            </a>

            <a routerLink="/tree-selector" class="action-card">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                    </svg>
                </div>
                <h3>Stammbaum wechseln</h3>
                <p>Wähle einen anderen aktiven Stammbaum</p>
            </a>

            <a *ngIf="authService.currentUser()?.isAdmin" routerLink="/admin/users" class="action-card">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>
                <h3>Benutzerverwaltung</h3>
                <p>Nutzer hinzufügen oder Berechtigungen anpassen</p>
            </a>
        </div>

        <div class="back-link">
            <a routerLink="/" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Zurück zum Dashboard</span>
            </a>
        </div>
    </div>
</div>
