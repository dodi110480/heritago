<div class="max-w-6xl mx-auto pb-20">
    <app-page-header [title]="'Suchergebnisse für „' + query() + '“'"
        description="Gefundene Personen in deiner Familiengeschichte">
    </app-page-header>

    <!-- LOADING -->
    <div *ngIf="loading()" class="flex flex-col items-center justify-center py-32 animate-in fade-in">
        <div
            class="w-12 h-12 border-4 border-neutral-300/40 border-l-brand-500 rounded-full animate-spin shadow-brand-glow mb-6">
        </div>
        <p class="text-xs font-black text-neutral-950 uppercase tracking-widest">Suche läuft...</p>
    </div>

    <!-- NO RESULTS -->
    <div *ngIf="!loading() && results().length === 0"
        class="flex flex-col items-center justify-center py-32 text-center animate-in zoom-in-95 duration-700">
        <div
            class="w-24 h-24 bg-brand-100 rounded-[32px] flex items-center justify-center text-4xl mb-8 border border-neutral-300/60 shadow-xl">
            🔎
        </div>
        <h2 class="text-2xl font-black text-neutral-900 tracking-tight mb-2">Keine Ergebnisse gefunden</h2>
        <p class="text-neutral-950 max-w-xs leading-relaxed">Bitte versuche es mit einem anderen Suchbegriff oder
            prüfe die Schreibweise.</p>
    </div>

    <!-- RESULTS GRID -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-in slide-in-from-bottom-5 duration-700 delay-150"
        *ngIf="!loading() && results().length > 0">
        <app-entity-card *ngFor="let result of results()" [title]="result.name" [subtitle]="result.lifespan"
            [badgeText]="'Treffer'" [badgeColor]="result.gender === 'F' ? 'rose' : result.gender === 'M' ? 'blue' : 'slate'"
            [icon]="result.gender === 'F' ? '👩' : result.gender === 'M' ? '👨' : '👤'" [routerLink]="['/tree']"
            [queryParams]="{focus: result.id}">
        </app-entity-card>
    </div>
</div>
