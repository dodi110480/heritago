<div class="search-container">
    <h2>Suchergebnisse für "{{ query() }}"</h2>

    <div *ngIf="loading()" class="loading">Suche läuft...</div>

    <div *ngIf="!loading() && results().length === 0" class="no-results">
        Keine Ergebnisse gefunden.
    </div>

    <div class="results-grid" *ngIf="!loading() && results().length > 0">
        <a *ngFor="let result of results()" [routerLink]="['/tree']" [queryParams]="{focus: result.id}"
            class="result-card">
            <div class="result-icon">
                <svg *ngIf="result.gender === 'M'" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="text-blue-400">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 16v-4" />
                    <path d="M12 8h.01" />
                </svg>
                <svg *ngIf="result.gender === 'F'" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="text-pink-400">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 16v-4" />
                    <path d="M12 8h.01" />
                </svg>
                <svg *ngIf="result.gender !== 'M' && result.gender !== 'F'" xmlns="http://www.w3.org/2000/svg"
                    width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" class="text-gray-400">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 16v-4" />
                    <path d="M12 8h.01" />
                </svg>
            </div>
            <div class="result-info">
                <h3>{{ result.name }}</h3>
                <p class="lifespan">{{ result.lifespan }}</p>
            </div>
        </a>
    </div>
</div>
