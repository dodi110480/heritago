<div class="create-tree-container">
    <div class="glass-card">
        <div class="header">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22a9 9 0 1 1 0-18 9 9 0 0 1 0 18z" />
                    <path d="M12 18v-6" />
                    <path d="M12 10V7" />
                    <path d="M12 22v-4" />
                </svg>
            </div>
            <h1>Neuer Stammbaum</h1>
            <p>Beginne deine Reise in die Vergangenheit</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="tree-form" #createForm="ngForm">
            <div class="form-section">
                <h3>Stammbaum Details</h3>
                <div class="form-group">
                    <label for="title">Anzeigename des Stammbaums *</label>
                    <input type="text" id="title" name="title" [(ngModel)]="title" required
                        placeholder="z.B. Familie Meier">
                </div>
            </div>

            <div class="form-section">
                <h3>Erste Person anlegen</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">Vorname *</label>
                        <input type="text" id="firstName" name="firstName" [(ngModel)]="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Nachname *</label>
                        <input type="text" id="lastName" name="lastName" [(ngModel)]="lastName" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="gender">Geschlecht</label>
                        <select id="gender" name="gender" [(ngModel)]="gender">
                            <option value="M">Männlich</option>
                            <option value="F">Weiblich</option>
                            <option value="X">Divers</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="birthDate">Geburtsdatum</label>
                        <input type="text" id="birthDate" name="birthDate" [(ngModel)]="birthDate"
                            placeholder="z.B. 01 JAN 1900">
                    </div>
                </div>
            </div>

            <div *ngIf="error()" class="error-message">
                {{ error() }}
            </div>

            <button type="submit" [disabled]="!createForm.form.valid || loading()" class="submit-btn"
                [class.loading]="loading()">
                <span *ngIf="!loading()">Stammbaum erstellen</span>
                <span *ngIf="loading()" class="loader"></span>
            </button>
        </form>
    </div>
</div>
