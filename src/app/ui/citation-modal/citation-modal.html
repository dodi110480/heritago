<app-modal-shell [visible]="visible()" 
  [title]="citation() ? 'Beleg bearbeiten' : 'Beleg hinzufügen'" 
  icon="📖" size="md" [showSave]="true"
  [saveText]="citation() ? 'Speichern' : 'Hinzufügen'" 
  [showDelete]="citation() !== null" 
  (close)="close.emit()"
  (save)="onSave()" 
  (delete)="onDelete()">

  <div class="flex flex-col h-[450px] max-h-[60vh]">
    <!-- Tabs -->
    <div class="flex border-b border-neutral-200 dark:border-neutral-800 mb-4 shrink-0">
      <button (click)="activeTab.set('basics')"
        [class]="activeTab() === 'basics' ? 'border-b-2 border-brand-500 text-brand-500' : 'text-neutral-500 hover:text-neutral-700 dark:hover:text-neutral-300'"
        class="px-4 py-3 text-xs font-bold uppercase tracking-wider transition-all">Basis</button>
      
      <button (click)="activeTab.set('notes')"
        [class]="activeTab() === 'notes' ? 'border-b-2 border-brand-500 text-brand-500' : 'text-neutral-500 hover:text-neutral-700 dark:hover:text-neutral-300'"
        class="px-4 py-3 text-xs font-bold uppercase tracking-wider transition-all">
        Notizen 
        <span *ngIf="draft().notes?.length" class="ml-1 px-1.5 py-0.5 bg-neutral-100 dark:bg-neutral-800 rounded-full text-[10px]">
          {{draft().notes?.length}}
        </span>
      </button>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-y-auto pr-1 custom-scrollbar">
      
      <!-- BASICS TAB -->
      <div *ngIf="activeTab() === 'basics'" class="space-y-4 animate-in fade-in slide-in-from-top-2 duration-300">
        <div class="form-group mb-0">
          <label class="form-label text-[10px] uppercase font-bold tracking-wider text-neutral-500">Quelle</label>
          <select [(ngModel)]="draft().sourceId" class="form-input !py-1.5 text-sm shadow-sm">
            <option value="">— Quelle wählen —</option>
            <option *ngFor="let s of availableSources()" [value]="s.id">
              {{ s.title }}{{ s.author ? ' · ' + s.author : '' }}
            </option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="form-group mb-0">
            <label class="form-label text-[10px] uppercase font-bold tracking-wider text-neutral-500">Seite/Ort</label>
            <input type="text" [(ngModel)]="draft().whereInSource" class="form-input !py-1.5 text-sm shadow-sm" placeholder="z.B. S. 12">
          </div>
          <div class="form-group mb-0">
            <label class="form-label text-[10px] uppercase font-bold tracking-wider text-neutral-500">Datum im Beleg</label>
            <input type="text" [(ngModel)]="draft().date" class="form-input !py-1.5 text-sm shadow-sm" placeholder="z.B. 12 JAN 1900">
          </div>
        </div>

        <div class="form-group mb-0">
          <label class="form-label text-[10px] uppercase font-bold tracking-wider text-neutral-500">Qualität</label>
          <select [(ngModel)]="draft().quality" (ngModelChange)="draft().quality = +$event" class="form-input !py-1.5 text-sm shadow-sm">
            <option [value]="3">Sicher (3)</option>
            <option [value]="2">Sehr wahrscheinlich (2)</option>
            <option [value]="1">Wahrscheinlich (1)</option>
            <option [value]="0">Unzuverlässig (0)</option>
          </select>
        </div>

        <div class="form-group mb-0">
          <label class="form-label text-[10px] uppercase font-bold tracking-wider text-neutral-500">Zitat / Ausschnitt</label>
          <textarea [(ngModel)]="draft().text" 
            class="form-input !py-1.5 text-sm min-h-[100px] shadow-sm leading-relaxed"
            placeholder="Zitierten Text hier einfügen..."></textarea>
        </div>
      </div>

      <!-- NOTES TAB -->
      <div *ngIf="activeTab() === 'notes'" class="animate-in fade-in slide-in-from-top-2 duration-300">
        <app-notes-list
          [entityId]="draft().id || 'new-citation'"
          [entityType]="'CITATION'"
          [notesDisplay]="draft().notes || []"
          [allowCreate]="true"
          [allowEdit]="true"
          [showHeader]="true"
          (noteCreateRequested)="onNoteCreateRequested()"
          (noteEditRequested)="onNoteEditRequested($event)"
          (noteDeleted)="onNoteDeleted($event)"
        ></app-notes-list>
      </div>

    </div>
  </div>

  <!-- Note Sub-Modal -->
  <app-note-modal
    [visible]="showNoteModal()"
    [note]="activeNote()"
    (close)="showNoteModal.set(false)"
    (save)="onNoteSave($event)"
    (delete)="onNoteDeleteFromModal()"
  ></app-note-modal>

</app-modal-shell>
